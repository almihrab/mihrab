<!DOCTYPE html>
<!--
  محرابٌ في المتصفّح — صفحةُ المضيف.

  ‏`vscode-web` المنبعيُّ **مكتبةٌ لا موقع**: لا `index.html` فيه ولا `product.json`.
  يُصدِّر `create()` وينتظر أن تكتب أنت الصفحةَ التي تُقلِعه وتمرّر إعدادَ المنتَج.
  هكذا يعمل `vscode.dev` نفسُه — مايكروسوفت تكتب صفحتَه.

  وهذا مكسبٌ لا عائق: نتحكّم بالعنوان والخطّ وشاشة الإقلاع وهويّةِ محرابٍ كاملةً،
  بدل أن نرقّع صفحةً منبعيّة.

  ولا خادمَ خلف هذه الصفحة: ملفّاتٌ ثابتةٌ فقط. لا نظامَ ملفّاتٍ مكشوف، ولا طرفيّة،
  ولا عمليّةَ تعمل — والملفّاتُ من جهاز الزائر عبر File System Access.

  ⚠️ هذا الملفُّ مصدرُ الحقيقة. ‏`build/patch_web_host.py` ينسخه إلى شجرة `vscode-web`
     في كلّ بناء، ويؤكّد التطابقَ في `--verify`. لا يُحرَّر في الشجرة المبنيّة.
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <!-- ‏`maximum-scale`/`user-scalable` محذوفان عمدًا: منعُ التكبير مخالفةُ WCAG 1.4.4،
       وقفزةُ تكبيرِ اللمس التي يمنعانها لا توازي حرمانَ ضعيفِ البصر منه. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="محراب">
  <meta name="theme-color" content="#0d1f1c">
  <meta name="description" content="محراب — محرِّرُ شيفرةٍ عربيُّ الاتّجاه، يعمل في متصفّحك بلا تثبيت.">
  <title>محراب</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="code-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="out/vs/workbench/workbench.web.main.internal.css">

  <!-- ‏**سلسلةُ الاعتماد لا عددُ الطلبات هي الكلفة.** الشجرةُ كلُّها `no-cache`
       (‏`/out/` و`/` معًا)، فالزائرُ العائدُ يدفع مراجعةً مشروطةً لكلّ ملفّ — وهي
       304 بصفرِ بايت، فالثمنُ **رحلاتُ ذهابٍ وإياب**. وأثقلُ ملفٍّ في الشجرة
       يُكتشَف اليومَ في الجولة الثالثة: استيرادٌ ديناميٌّ داخل `boot.js` لا يُرى
       قبل تنفيذه. و`modulepreload` ينقله إلى الثانية. وعنوانُه هنا يطابق ما
       يستورده `boot.js` حرفيًّا، فلا تنزيلَ مزدوج.

       ✅ **وللخطّ `preload` — بعد إصلاح المُلتقِط وبعد قياس.**
       وكان مُسقَطًا لسببٍ صحيح: **فشلُ جلبِ خطٍّ من CSS لا يُطلِق حدثَ `error`
       على أيّ وسم** — ترتدّ الورشةُ إلى خطٍّ احتياطيٍّ وتعمل. وإعطاؤه وسمَ
       `<link>` يمنحه ذلك الحدثَ، ومُلتقِطُ `boot-early.js` كان يعدّ كلّ مورد
       `LINK`/`SCRIPT` من أصلنا فشلًا حاسمًا — فيرسم شاشةَ فشلٍ `inset:0` فوق ورشةٍ
       تعمل تمامًا. وقد أُغلِق ذاك في `boot-early.js:149`: التبكيرُ يُتخطّى ولا يُحكَم به.

       **والمكسبُ قُيس ولم يُفترَض.** الخطُّ 106 ك.ب، مشارٌ إليه بـ`url(kawkab-mono.woff2)`
       **نسبيًّا داخل** `workbench.web.main.internal.css` (1.2 م.ب). وخطُّ CSS لا يُجلَب
       عند تحليل الورقة بل **عند أوّل عنصرٍ مرسومٍ يطابقه**، أي بعد نزول حزمة
       الورشة (16.4 م.ب) وتنفيذِها ورسمِها. فترتيبُه كان:
         الجولة 1: index.html · 2: الورقة والحزمة · … بعد 16.4 م.ب: الخطّ
       والتبكيرُ ينقله إلى الجولة الثانية، بجانب الحزمة — 106 ك.ب إلى جوار 16.4 م.ب،
       أي مجّانًا عمليًّا. والقاعدةُ `font-display:swap`، فبلا تبكيرٍ يُرسَم النصُّ العربيُّ
       بخطٍّ احتياطيٍّ ثمّ يقفز. **فالمكسبُ حذفُ القفزة، لا تسريعُ البايتات.**

       ⚠️ و`crossorigin` **لازمةٌ ولو كان الأصلُ واحدًا**: الخطوطُ تُجلَب في وضع CORS
       مجهولٍ دائمًا، فتبكيرٌ بلا الرّاية لا يطابق طلبَ `@font-face` **فيُنزّل الخطُّ
       مرّتَين** — تحسينٌ يضاعف الكلفة ويبدو نافعًا في السجلّ. والعنوانُ هنا من
       جذر الموقع (`out/vs/workbench/`) لا كما في الورقة، لأنّ نسبيَّ الورقة يُحلّ عليها
       لا على الصفحة. ووجودُ كلّ عنوانٍ مُبكّرٍ مفروضٌ في `patch_web_host.py`: وسمٌ
       يشير إلى لا شيءٍ يدفع رحلةً ويردّ 404، وهو عكسُ ما وُضِع له. -->
  <link rel="modulepreload" href="out/vs/workbench/workbench.web.main.internal.js">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="out/vs/workbench/kawkab-mono.woff2">

  <style>
    /* شاشةُ إقلاعٍ عربيّة: أوّلُ تحميلٍ بارد **نحو 4.6 م.ب تنزيلًا** (‏18.8 م.ب على
       القرص — وnginx يضغطها). فثوانٍ على اتّصالٍ متوسّط، وأكثرُ على متواضع.
       وصفحةٌ بيضاءُ صامتةٌ في تلك المدّة تُقرأ عطبًا. */
    html, body { height: 100%; margin: 0; background: #0d1f1c; color: #cfe8e3; }
    #mihrab-boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 1.25rem;
      /* خطُّ النظام عمدًا: `Kawkab Mono` يسكن `@font-face` داخل ورقةِ الورشة الثقيلة،
         فالوعدُ به هنا يعني رسمًا بخطٍّ احتياطيٍّ ثمّ قفزةً حين تصل. ولا نَعِد بما يتأخّر. */
      font-family: "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
      transition: opacity .35s ease; z-index: 9999;
    }
    /* ⛔ لا `letter-spacing` هنا: يفكّ وصلَ الحروف العربيّة — و«محراب» أوّلُ كلمةٍ
       يراها الزائر، وهي العلامةُ نفسُها. */
    #mihrab-boot .name { font-size: 2.4rem; }
    #mihrab-boot .hint { font-size: .95rem; opacity: .72; max-width: 30rem;
                         text-align: center; line-height: 1.9; padding: 0 1.5rem; }
    #mihrab-boot .bar {
      width: 12rem; height: 2px; background: #1d3b36; overflow: hidden; border-radius: 2px;
    }
    #mihrab-boot .bar i {
      display: block; height: 100%; width: 35%; background: #2ec4a6;
      animation: mihrab-slide 1.1s ease-in-out infinite;
    }
    /* يمينًا ثمّ يسارًا — لأنّ القراءةَ كذلك. */
    @keyframes mihrab-slide { 0% { margin-right: -35% } 100% { margin-right: 100% } }
    /* وشريطٌ لا يتحرّك يكذب بالإيحاء: يبدو ممتلئًا أو عالقًا. فيُخفى، ويكفي النصُّ
       المتدرّجُ وحدَه — وهو أصدقُ من شريطٍ بلا مرجعٍ أصلًا. */
    @media (prefers-reduced-motion: reduce) {
      #mihrab-boot .bar { display: none }
      #mihrab-boot { transition: none }
    }
    #mihrab-boot.gone { opacity: 0; pointer-events: none; }
    #mihrab-boot .err { color: #ff9b8a; max-width: 34rem; text-align: center; line-height: 1.9; }
    #mihrab-boot button {
      font: inherit; color: #0d1f1c; background: #2ec4a6; border: 0; border-radius: 4px;
      padding: .5rem 1.4rem; cursor: pointer;
    }
    #mihrab-boot button:focus-visible { outline: 2px solid #cfe8e3; outline-offset: 2px; }
  </style>
</head>

<body aria-label="محراب">
  <noscript>
    <div style="padding:2rem;text-align:center;line-height:2">
      <strong style="font-size:1.6rem">محرابٌ يحتاج جافاسكربت.</strong><br>
      فعِّلها في متصفّحك ثمّ أعِد تحميل الصفحة.
    </div>
  </noscript>

  <div id="mihrab-boot">
    <div class="name">محراب</div>
    <div class="bar" role="progressbar" aria-label="تقدّمُ التحميل"><i></i></div>
    <div class="hint" id="mihrab-hint" role="status" aria-live="polite">يُهيَّأ المحراب…</div>
  </div>

  <!-- سكربتُ الإقلاع في ملفٍّ مجاورٍ لا كتلةً هنا [WEB-09]: كتلةٌ داخليّةٌ
       واحدةٌ تُلزِم سياسةَ الأمان بـ`'unsafe-inline'`، وهو يُبطِل أنفعَ ما
       فيها. ووسمٌ كلاسيكيٌّ قبل وسوم الوحدات ⇒ يُنفَّذ قبلها كلِّها. -->
  <script src="boot-early.js"></script>

  <!-- الإنجليزيّةُ أساسًا، ثمّ العربيّةُ المخبوزةُ تدوسها. الترتيبُ مقصودٌ ومنبعيّ.
       ووسمٌ واحدٌ لا اثنان كالمنبع: `bake_nls_arabic.py` يخبز العربيّةَ **في** ملفِّ
       الاحتياط نفسِه، فلا ملفَّ لغةٍ ثانٍ يُحمَّل فوقه. -->
  <script type="module" src="out/nls.messages.js"></script>

  <!-- هويّةُ محراب مشتقّةً من `product-overrides/product.json` في البناء — لا مكتوبةً
       هنا مرّةً ثانية. يولّده `build/patch_web_host.py`. -->
  <script src="product.web.js"></script>
  <script type="module" src="boot.js"></script>
</body>
</html>
