# نشرُ موقع توثيق محراب العربيّ على GitHub Pages.
#
# المولِّدُ لنا (site/build.py) لا Jekyll: دعمُ RTL في القوالب الجاهزة طبقةٌ مضافة
# تغطّي التخطيطَ ولا تغطّي عزلَ bidi ولا اتّجاهَ الدرج ولا تخطيطَ الطباعة — وهي
# بالضبط الحالاتُ التي بُني الموقعُ لأجلها.
#
# ⚠️ ما يُنشَر هنا **مرآة**. الأصلُ https://mihrab.dev/ على خادمنا، وإليه
# تشير هويّةُ المنتج و`rel=canonical` في كلّ صفحة. سببُ وجود المرآة أنّ الثنائيّات
# تسكن الخادم (٣٠٠ ميغابايت للمثبِّت، وPages ليس مخزنَ ملفّات) بينما الصفحاتُ
# رخيصة — فمن العبث حرمانُ الموقع من احتياطٍ مجّانيّ إن سقط الخادم. والمولِّدُ واحد،
# فلا انجرافَ بين النسختين. النشرُ إلى الأصل: build/deploy_site.sh.
name: الموقع — بناء ونشرُ المرآة

on:
  push:
    branches: [main]
    # المساراتُ هي **ما يغيّر المرآةَ المنشورة** لا كلُّ ما يقرؤه `check_site.py`.
    # فهو يقرأ أيضًا `deploy/nginx/**` و`build/deploy_site.sh` ([W404] و[CORS-01]
    # و[CSP-01])، وهما عمدًا **ليسا هنا**: تغييرُهما لا يغيّر بايتًا في المخرَج،
    # فنشرُ المرآة لأجله نشرٌ بلا فرق. وحراستُهما على كلّ دفعةٍ لا تسقط بذلك —
    # `build-matrix.yml` يشغّل `check_site.py` في وظيفة `quick` **بلا مرشِّح
    # مسارات**، فكلُّ دفعةٍ إلى main تقيسهما. وما هنا يحرس **البناء**: مصدرُه
    # وبياناتُه وقالبُه وحارسُه وهويّةُ المنتج التي تُقرأ فيه.
    paths:
      - 'site/**'
      - 'tests/docs/**'
      - 'product-overrides/product.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:
  schedule:
    # فحصُ الانجراف اليوميّ: بلا أتمتةٍ تصير إشارةُ «مترجَم عن…» كذبًا خلال شهرين.
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # اكتمالُ البيانات الوصفيّة يُفحَص بلا شبكة — يحجب البناءَ فورًا.
      - name: تحقّق البيانات الوصفيّة للترجمة
        run: python tests/docs/check_drift.py --offline

      # الفحصُ البنيويّ يبني بنفسه ويحجب النشرَ عند أوّل عطب: زرُّ تنزيلٍ يقود إلى
      # 404، أو مِرساةٌ يبحث عنها site.js ولا يجدها — كلاهما لا يظهر في المتصفّح.
      - name: فحص بنية الموقع
        run: python tests/docs/check_site.py

      # شاهدُ البناء `.mihrab-site-build` أثرٌ داخليٌّ لـ`build.py` (يأذن للبناء التالي
      # بمحو المخرَج) لا جزءٌ من الموقع. `deploy_site.sh` يستثنيه من `tar` ويَعِد
      # «الشاهدُ نفسُه لا يُشحَن» — والمرآةُ كانت تشحنه، لأنّ `upload-pages-artifact`
      # يرفع المجلّدَ كلَّه بلا استثناء. فيُزال هنا بعد الفحص لا قبله: الفحصُ يبني
      # ويقيس المخرَجَ كما يُنتجه `build.py`، والرفعُ ينشر الموقعَ لا أثرَه.
      - name: إزالةُ شاهد البناء قبل الرفع
        run: rm -f site/public/.mihrab-site-build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  drift:
    # انجرافُ المنبع لا يمنع النشر — يُبلِّغ. الصفحةُ المترجَمة تبقى نافعةً وإن تحرّك
    # أصلُها؛ الخطرُ أن يمرّ التحرّكُ **صامتًا**، وهذا ما يمنعه هذا العمل.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: فحص انجراف الترجمة عن المنبع
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/docs/check_drift.py

  live:
    # مجسُّ الحيّ [LIVE-01]: يسأل الخادمَ لا الشجرة — الشهادة، والخطوطُ الحيّة، وصفحةُ
    # ‎404‎ على الأصلين، وملفّاتُ المانيفست، وآخرُ مصفوفةِ بناء. يحتاج شبكةً فلا يدخل
    # `quick`؛ ويجري مجدوَلًا يوميًّا فقط: احمرارُه يعني أنّ ما نُشر انحرف عمّا في
    # الشجرة أو أنّ الشهادةَ تقترب من نهايتها — لا أنّ الدفعةَ معطوبة.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: مجسُّ الحيّ
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python tests/live/probe_live.py
