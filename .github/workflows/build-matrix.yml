# بناءُ محراب على المنصّات الثلاث — حارسٌ على كلّ دفعة.
#
# لماذا؟ كان البناءُ يجري على جهازٍ ويندوزيٍّ واحد، فكانت «محراب يعمل» تعني «يعمل
# هنا». وكلُّ ويندوزيّةٍ تسرّبت إلى build.sh لم تُكتشَف لأنّ لا أحدَ شغّله على غيرها.
# وهذا العملُ يجعل انكسارَ لينكس أو macOS **يوقف الدفعة** لا يُكتشَف عند أوّل مستخدم.
#
# ⚠️ ليس فحصًا رخيصًا: كلُّ منصّةٍ تبني VSCodium كاملًا (٤٠–٧٠ دقيقة). ولهذا:
#   · REH مُطفأ (`SHOULD_BUILD_REH=no`) — خادمٌ بعيد لا نشحنه بعد، وبناؤه يضيف
#     ~١٢ دقيقة لكلّ منصّة بلا أن يحرس شيئًا نشحنه. أمّا REH-web فيُبنى (‏`61e877a`):
#     هو محرابُ المتصفّح و[WEB-01] في L2 يشترطه — انظر `env:` أدناه.
#   · الفحصُ البنيويّ الرخيص (`quick`) يسبق المصفوفةَ ويوقفها: خطأٌ نحويٌّ في
#     build.sh يجب ألّا يكلّف ساعتَي عدّاء.
name: بناء — المنصّات الثلاث

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_alif:
        description: 'بناءُ معاينةٍ يحمل إضافةَ لغة ألف مدمجةً (لمطوّري ألف — لا يُنشر على الصفحة الرئيسة)'
        type: boolean
        default: false
  # يُستدعى من سير النشر قبل رفع الثنائيّات: لا نَشرَ بلا بناءٍ أخضر على الثلاث.
  workflow_call:
    outputs:
      version:
        description: إصدارُ محراب المبنيّ
        value: ${{ jobs.build.outputs.version }}

concurrency:
  group: build-${{ github.ref }}
  # ⚠️ لا إلغاءَ على main. جرّبتُ الإلغاءَ فألغى دفعُ لقطةِ شاشةٍ بناءً على المنصّات
  # الثلاث كان قد بلغ منتصفَه — ولا شيءَ في اللقطة يمسّ البناء. ودفعتان متقاربتان
  # على main أمرٌ عاديّ، فيصير الحارسُ الذي لا يُكمِل حارسًا لا يحرس.
  # وعلى فروع المراجعة الإلغاءُ صواب: آخرُ دفعةٍ وحدها هي المعنيّة.
  # ⚠️ و«لا إلغاء» يعني لا إلغاءَ **لتشغيلٍ جارٍ**: المجموعةُ تحتمل تشغيلًا جاريًا وواحدًا
  # منتظرًا، فدفعةٌ ثالثةٌ تُلغي **المنتظِر** (‏`5e5cdc6` و`a53a34b` أُلغيا هكذا). أي أنّ
  # دفعاتٍ متقاربةً على main لا تُبنى كلُّها — آخرُها وحده بعد الجاري.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── البوّابة الرخيصة ──
  quick:
    name: فحصٌ نحويّ وبنيويّ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: صياغةُ سكربتات البناء
        run: |
          for f in build/*.sh build/lib/*.sh; do
            bash -n "$f" && echo "✅ $f"
          done

      # حراسُ بناءِ المعاينة (L0): العطبان اللذان أسقطا بناءَ المعاينةِ الأوّلَ في
      # منصّتين — أداةُ بصمةٍ غائبةٌ وفاصلٌ يقطع مسارَ ويندوز — يُمسَكان هنا في ثانية
      # بدل ساعةِ بناءٍ في كلّ منصّة.
      - name: حراسُ بناءِ المعاينة
        run: bash tests/static/check_extra_ext_dirs.sh

      # البايتكودُ خارج الشجرة: ‏`site/__pycache__` بجانب المصدر يُحمِّر [GEN-01] في الخطوة التالية.
      - name: صياغةُ المرقِّعات
        env: { PYTHONPYCACHEPREFIX: "${{ runner.temp }}/pyc" }
        run: python -m compileall -q build/ tests/ site/ && echo "✅ بايثون سليمة"

      - name: بنيةُ الموقع
        run: python tests/docs/check_site.py

      # ‏[OUT-02] في وضع بوّابة النشر (`--no-build`): كلُّ مُصابٍ يمرّ عبر البناء فلا يراه.
      - name: بوّابةُ النشر
        run: python tests/docs/test_check_site_nobuild.py

      # أداتا الإثبات تُحرَسان هنا لا في حارس الحرّاس: أداةُ «متطابق» خضراءُ دائمًا تُلصَق
      # في طلب دمجٍ غيّر المخرَج. (‏node مثبَّتٌ في صورة ubuntu-latest.)
      - name: أداتا إثبات الموقع
        run: |
          python tests/docs/test_same_output.py
          python tests/docs/test_det_check.py
          python tests/docs/test_strip.py
          python tests/docs/test_site_guard_names.py
          python tests/docs/test_checks_catalog.py
          node --test tests/meta/dump_norm.test.mjs

      # ‏[PKG-02] غلافُ curl لتغليف لينكس: بلا هذا لا يُرى يعمل إلّا في بناء لينكس بعد ساعة.
      - name: غلافُ curl للتغليف
        run: bash tests/static/test_curl_shim.sh

      # ‏[ON-03] بياناتُ المساعدة تُولَّد عند الحزم: المولِّدُ يُقاس هنا بلا بناء، والحزمةُ في L2.
      - name: مولِّدُ بيانات المساعدة
        run: python tests/static/test_help_data.py

      # منصّةٌ خاطئةٌ في السطر الأوّل أرخصُ اكتشافًا من فشلٍ في الدقيقة الأربعين.
      - name: كشفُ المنصّة في build.sh
        run: |
          out=$(bash build/build.sh --platform)
          [[ "$out" == "linux/x64 out=VSCode-linux-x64" ]] \
            || { echo "❌ كُشف على عدّاء لينكس: $out"; exit 1; }
          echo "✅ $out"

  # ── البوّابةُ الرخيصةُ على ويندوز ──
  # ‏#51 سقط مرّتين في بناءَي ويندوز وحدهما بعد ساعةٍ من البناء: ترميزُ الأنبوب cp1252، ومسارٌ أو
  # صدفةٌ تختلف. فالحرّاسُ الساكنةُ والأدواتُ التي لا تحتاج بناءً تُشغَّل هنا أيضًا، في دقيقتين.
  # ولا ينتظرها `build` (‏needs: quick وحدَها): تعمل بالتوازي، وفشلُها يُرى قبل البناءات.
  quick-windows:
    name: فحصٌ سريعٌ على ويندوز
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: الحرّاسُ الساكنة (L0)
        run: python tests/static/lint_patchers.py

      # المرقِّعاتُ تعمل فعلًا على عدّاءَي ويندوز داخل البناء.
      - name: مراسي الرُقَع على لقطة المنبع (L1)
        run: python tests/apply/check_anchors.py

      - name: أدواتُ الموقع والحارس
        run: |
          python tests/static/test_help_data.py
          python tests/docs/test_det_check.py
          python tests/docs/test_strip.py
          python tests/docs/test_site_guard_names.py
          python tests/docs/test_checks_catalog.py
          node --test tests/meta/dump_norm.test.mjs

      - name: بنيةُ الموقع
        run: python tests/docs/check_site.py

      # أحسُّ الأدوات بالمنصّة: عمليّاتٌ فرعيّة، ومسارات، ووصلاتٌ ومحوُ مجلّدات.
      - name: بوّابةُ النشر وأداةُ «متطابق»
        run: |
          python tests/docs/test_check_site_nobuild.py
          python tests/docs/test_same_output.py

  build:
    needs: quick
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    strategy:
      # fail-fast=false عمدًا: أوّلُ فشلٍ ليس كلَّ الفشل. حين ينكسر لينكس وmacOS
      # معًا لسببين مختلفين، إلغاءُ الثاني يخفي نصفَ المشكلة إلى الدفعة التالية.
      fail-fast: false
      matrix:
        include:
          # jobs=2 على لينكس لا 4: عدّاءُ أوبنتو مات بـ«runner received a shutdown
          # signal» في منتصف حزم esbuild — وهي بصمةُ نفادِ ذاكرةٍ لا خطأِ بناء.
          # أربعُ وظائفَ متوازية × 8GB لكومة V8 تتجاوز ذاكرةَ العدّاء.
          #
          # ── الثمانيةُ كلُّها تُبنى ──
          # كانت ثلاثةً، وصفحةُ التنزيل تُعلِن ثمانيًا: خمسةُ صفوفٍ رماديّةٍ تقول
          # «لم يُبنَ بعد» من ثمانٍ. ويحرس التطابقَ [PKG-01] في L0: كلُّ `id` في
          # `site/data/site.json` له `assets:` هنا **وفرعُ تغليفٍ** في
          # `build/package_assets.sh`، ولا معرّفَ هنا تجهله الصفحة.
          #
          # وعدّةُ أصولٍ في الوظيفة الواحدة حيث يكفي بناءٌ واحد: حزمةُ دبيان
          # وحزمةُ فيدورا والأرشيفُ المحمول ثلاثةُ تغليفاتٍ لشجرةٍ واحدة، وبناؤها
          # ثلاثَ مرّاتٍ ساعتان ضائعتان ومخاطرةُ اختلافِ ثلاثِ نسخٍ من الشيء نفسِه.
          - { name: لينكس x64,       os: ubuntu-22.04,    arch: x64,   out: VSCode-linux-x64,    jobs: 2,
              assets: linux-x64-tar linux-x64-deb linux-x64-rpm, native: true }
          # ‏`macos-14` لم يعد يُسنَد له عدّاء: الوظيفةُ تُلغى في ثانيةٍ بلا خطوةٍ واحدة
          # (‏`907b437` و`3ec7a34`). و`macos-15` هو عدّاءُ arm64 القياسيّ.
          - { name: macOS arm64,     os: macos-15,        arch: arm64, out: VSCode-darwin-arm64, jobs: 3,
              assets: mac-arm64, native: true }
          # عدّاءٌ إنتلٌ **أصليّ** لا ترجمةٌ متقاطعة: اختبارُ الإقلاع أدناه هو
          # نصفُ قيمةِ هذه الوظيفة، وثنائيُّ x64 لا يُشغَّل على عدّاءٍ من سيليكون.
          # ⚠️ ولا بديلَ إنتليًّا آخرَ: `macos-13` **متقاعدٌ سلفًا**، وهذا الوسمُ
          # هو ما حلّ محلَّه. فإن زال فلا خيارَ إلّا الترجمةُ المتقاطعة على
          # عدّاء arm64 (`MIHRAB_ARCH=x64`) — **ويُسقَط معها اختبارُ الإقلاع**
          # بـ`native: false` صراحةً لا صامتًا، كما في صفّ ويندوز arm64.
          - { name: macOS x64,       os: macos-15-intel,  arch: x64,   out: VSCode-darwin-x64,   jobs: 3,
              assets: mac-x64, native: true }
          - { name: ويندوز x64,      os: windows-2022,    arch: x64,   out: VSCode-win32-x64,    jobs: 4,
              assets: win-x64-zip win-x64-setup, native: true }
          # ‏arm64 ترجمةٌ متقاطعةٌ على عدّاء x64 — ولا عدّاءَ ويندوزَ arm64 عامًّا.
          # و`npm_config_arch` في `build.sh` هو ما يمنع شحنَ `.node` بمعماريّة
          # المضيف داخل شجرةٍ يبدو كلُّ شيءٍ فيها صحيحًا.
          - { name: ويندوز arm64,    os: windows-2022,    arch: arm64, out: VSCode-win32-arm64,  jobs: 4,
              assets: win-arm64-setup, native: false }

    defaults:
      run: { shell: bash }

    env:
      # ‏REH: خادمٌ بعيد لا نشحنه — ~١٢ دقيقةً لكلّ منصّة بلا حراسة.
      SHOULD_BUILD_REH: 'no'
      # ‏REH-web **يُبنى**: هو محرابُ المتصفّح، و`build.sh` يعرّبه (ط-0د) و[WEB-01] في
      # L2 يشترطه. كان مطفأً منذ 57b29cf فسقط L2 على كلّ منصّةٍ بلغته (‏`3ec7a34`):
      # حارسٌ يشترط ما تمنعه المصفوفة. والكلفةُ ~١٢ دقيقةً لكلّ وظيفة، بقرار المالك.
      SHOULD_BUILD_REH_WEB: 'yes'
      CI_BUILD: 'no'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # عدّاءُ أوبنتو يبدأ بـ~٢١ غيغابايت حرّة، والبناءُ يحتاج أكثر. الحذفُ يحرّر ~٣٠.
      - name: تحرير مساحة (لينكس)
        if: runner.os == 'Linux'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h / | tail -1

      - name: اعتماديّات البناء (لينكس)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot rpm \
            xvfb libnss3 libasound2 libgbm1 libgtk-3-0
          # ‏`dpkg-shlibdeps` يشتقّ اعتماديّاتِ الحزمة من الثنائيّات نفسِها
          # (‏`dependencies-generator.ts`)، وبدونه تُبنى حزمةٌ تُثبَّت ثمّ لا تُقلِع
          # على جهازٍ تنقصه مكتبة. وهو في `dpkg-dev` لا في الأساس.
          sudo apt-get install -y --no-install-recommends dpkg-dev

      # ذاكرةُ العدّاء لا تكفي ذروةَ الحزم. والمبادلةُ أبطأُ من الذاكرة لكنّها
      # تُنهي البناء — والبديلُ عدّاءٌ يموت بلا سجلٍّ مفيد بعد أربعين دقيقة.
      - name: مبادلة 8 غيغابايت (لينكس)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -h

      # ── معاينةُ لغة ألف ──
      # تُجلَب ببصمةٍ مثبَّتة من إصدارِ مستودعها، ولا تُودَع هنا: مصدرُ حقيقتها
      # مستودعُها. والخطوةُ مشروطةٌ بمدخلِ الاستدعاء اليدويّ وحده — فلا دفعةَ على
      # main تُنتج بناءً يحمل لغةً من خارج الدار بغير قصد.
      - name: جلبُ إضافة لغة ألف (معاينة)
        if: inputs.preview_alif
        run: bash build/fetch_alif_extension.sh

      - name: بناءُ محراب
        run: bash build/build.sh
        env:
          MIHRAB_JOBS: ${{ matrix.jobs }}
          # ‏`build.sh` يكشف معماريّةَ **المضيف** بـ`uname -m`؛ و`MIHRAB_ARCH` هو
          # ما يجعله يبني للهدف. وتصريحُه في كلّ صفٍّ — حتّى الأصليّ — يمنع
          # مسارَين: الصريحُ لا يخطئ، والصامتُ يخطئ يومَ يتغيّر العدّاء.
          MIHRAB_ARCH: ${{ matrix.arch }}
          MIHRAB_EXTRA_EXT_DIRS: ${{ inputs.preview_alif && format('{0}/.preview-extensions/alif-lang', github.workspace) || '' }}
          # ‏vscode-min-prepack ينزّل الإضافاتِ المدمجة من واجهة GitHub. وبلا رمزٍ
          # يكون النداءُ مجهولًا، وحدُّه ٦٠ نداءً في الساعة **لعنوان العدّاء لا
          # لنا** — وعدّاءاتُ macOS خلف عناوينَ مشتركةٍ مزدحمة. فسقط بناءُ macOS
          # بـ403 بعد ١٠ محاولات، بينما نجح لينكس في نفس اللحظة: عطبٌ يبدو
          # «خاصًّا بالمنصّة» وليس منها في شيء. والرمزُ يرفع الحدَّ إلى ١٠٠٠.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── بوّابةُ إضافةِ المعاينة ──
      # «مُجهَّزة» في سجلّ البناء ليست «وصلت الحزمة»: بينهما حلقةُ الحقن وجمعُ gulp
      # وشجرةُ منبعٍ قد تكون مرقَّعةً سلفًا. وبلا هذه البوّابة يُنتَج بناءٌ اسمُه
      # ‏«-alif» وليس فيه ألف، وسيرٌ أخضر، ويكتشفه مطوّرُ ألف لا نحن.
      - name: بوّابةُ إضافةِ ألف
        if: inputs.preview_alif
        run: python tests/bundle/check_preview_ext.py ".upstream/${{ matrix.out }}"
        env:
          MIHRAB_EXTRA_EXT_DIRS: ${{ format('{0}/.preview-extensions/alif-lang', github.workspace) }}

      # ── الطبقةُ الثانية على المشحون ──
      # ‏`check_injected.py` خمسةٌ وسبعون حارسًا **كُتبت ولم تكن تعمل في البوّابة**:
      # ‏`ci.yml` يشغّل L0 وL1 فقط، وهذه المهمّةُ كانت تبني ولا تفحص. فكان كلُّ حارسٍ
      # في L2 — بما فيه [WEB-01] و[BR-04] — يعمل على جهاز مطوّرٍ واحدٍ بويندوز.
      # و`MIHRAB_DIST_ROOT` صريحٌ هنا رغم أنّ الاشتقاقَ صار يعرف المنصّة: المصفوفةُ
      # تعرف اسمَ المخرَج يقينًا، والصريحُ لا يخطئ.
      - name: الطبقة L2 — تأكيدات الحزمة المشحونة
        run: python tests/bundle/check_injected.py
        env:
          MIHRAB_DIST_ROOT: ${{ format('{0}/.upstream/{1}', github.workspace, matrix.out) }}
          # ‏[WEB-03] يتخطّى نفسَه إن غابت الشجرةُ الثابتة — وهو تصرّفٌ صحيحٌ على جهاز
          # مطوّرٍ يبني هدفًا واحدًا، **وخطأٌ هنا**: البناءُ يُخرجها (خطوة ط-0ج2)، وهي
          # ما يُنشَر على mihrab.dev. وحارسٌ يتخطّى نفسَه في البوّابة ليس حارسًا —
          # ورايةٌ تُصنَع ولا تُرفَع هي بعينها العلّةُ التي صُنعت لأجلها.
          MIHRAB_REQUIRE_STATIC: '1'

      # ── تحقّقُ الهويّة على المخرَج ──
      # build.sh يفحص product.json وnls؛ هنا نفحص ما يخصّ المنصّة: أنّ أيقونتها
      # ليست أيقونةَ VSCodium. وهو الفحصُ الذي كان غيابُه سيشحن شعارَ مشروعٍ آخر.
      - name: تحقّقُ هويّة المنصّة
        run: |
          OUT=".upstream/${{ matrix.out }}"
          case "${{ runner.os }}" in
            Linux)
              test -f "$OUT/bin/mihrab" || { echo "❌ لا bin/mihrab"; exit 1; }
              test -f "$OUT/resources/app/product.json" || { echo "❌ لا product.json"; exit 1; }
              echo "✅ مشغِّلُ لينكس والهويّة موجودان" ;;
            macOS)
              APP=$(find "$OUT" -maxdepth 1 -name '*.app' -print -quit)
              test -n "$APP" || { echo "❌ لا حزمة .app"; exit 1; }
              test -f "$APP/Contents/Resources/code.icns" || echo "⚠️ لا code.icns في الحزمة"
              echo "✅ حزمةُ macOS: $(basename "$APP")" ;;
            Windows)
              test -f "$OUT/Mihrab.exe" || { echo "❌ لا Mihrab.exe"; exit 1; }
              echo "✅ Mihrab.exe موجود" ;;
          esac

      # ── اختبارُ الإقلاع ──
      # الخطواتُ قبله تثبت أنّ محرابًا **بُني** ويحمل الهويّة الصحيحة. ولا تثبت
      # أنّه **يفتح**: مكتبةٌ مشتركةٌ ناقصة، أو حزمةٌ لا تُقلع، تمرّ خضراءَ تمامًا
      # ثمّ تصل إلى المستخدم تنزيلًا لا يعمل. وهذه بالضبط الفجوةُ التي لا يسدّها
      # إلّا تشغيلُ الثنائيّ فعلًا — ودقيقةٌ هنا أرخصُ من إصدارٍ مسحوب.
      # ⚠️ **الإقلاعُ يُقاس حيث يمكن تشغيلُه.** بناءُ `win32-arm64` يجري على عدّاء
      # x64، وثنائيُّ arm64 لا يُنفَّذ هناك — فلو شُغِّلت هذه الخطوةُ لسقطت الوظيفةُ
      # على بناءٍ سليم، وهو فشلٌ في الحارس لا في المحروس ويدفع إلى تعطيله.
      # والتخطّي **مُعلَنٌ في الشرط** لا مدفونٌ في `|| true` داخل السكربت: حارسٌ
      # يتخطّى نفسَه بصمتٍ أسوأُ من غيابه. والأثرُ المقبولُ مُقاسٌ ومعروف: شحنُ
      # `win-arm64-setup` بلا اختبارِ إقلاع — تغطّيه [PKG-01] والفحوصُ الساكنة
      # وحدَها حتّى يوجد عدّاءُ ويندوزَ arm64 عامّ.
      - name: إقلاعُ التطبيق
        if: matrix.native
        run: |
          set -uo pipefail
          OUT=".upstream/${{ matrix.out }}"

          # ١) مسارُ CLI: يشغّل إلكترون بوضع Node ويقرأ product.json المشحون.
          #    نجاحُه يعني أنّ الحزمة متماسكة وأنّ الموارد في محلّها.
          case "${{ runner.os }}" in
            Linux)   CLI="$OUT/bin/mihrab" ;;
            Windows) CLI="$OUT/bin/mihrab.cmd" ;;
            macOS)   CLI="$(find "$OUT" -maxdepth 1 -name '*.app' -print -quit)/Contents/Resources/app/bin/mihrab" ;;
          esac
          test -f "$CLI" || { echo "❌ لا مشغِّل CLI: $CLI"; exit 1; }
          VER=$("$CLI" --version 2>&1) || { echo "❌ فشل --version:"; echo "$VER"; exit 1; }
          echo "$VER" | head -3
          echo "$VER" | head -1 | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "❌ خرْجُ --version ليس إصدارًا"; exit 1; }
          echo "✅ CLI يعمل"

          # ٢) إقلاعٌ رسوميٌّ حقيقيّ. على لينكس وحدَه لأنّ عطبَ «لا يفتح» هناك
          #    أكثرُه مكتبةٌ مشتركةٌ ناقصة، وهو ما لا يظهر إلّا عند رفع النافذة.
          #    عدّاءُ لينكس بلا شاشة، فـxvfb، وبلا صندوقِ كروم لأنّ ملفَّه هنا
          #    ليس setuid root.
          #
          # ⚠️ **لا تشغّل `bin/mihrab` هنا.** المغلِّفُ يُطلق النافذةَ منفصلةً ثمّ
          # يخرج فورًا بـ0، فمراقبةُ معرّفِ عمليّته تراقب الشاهدَ لا المشهود:
          # فشلت الخطوةُ بـ«مات التطبيق (خرج 0)» وسجلٌّ فارغ — وهو تناقضٌ ظاهر،
          # إذ الموتُ لا يخرج بصفر. الثنائيُّ الأصليُّ في جذر المخرَج هو الذي
          # يبقى في المقدّمة.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            MAIN="$OUT/mihrab"
            test -x "$MAIN" || { echo "❌ لا ثنائيَّ إقلاع: $MAIN"; ls -la "$OUT" | head -20; exit 1; }
            # ‏--no-zygote مقصود: كروميوم يشتقّ عمليّاتِ العرض من «الزيغوت» بـfork،
            # فترث سطرَ أوامره `--type=zygote` ولا يظهر `--type=renderer` في ps
            # أبدًا (الاسمُ وحدَه يتغيّر عبر prctl). فسقطت الخطوةُ بـ«لم تُرفع
            # نافذة» بينما كانت ثمانيُ عمليّاتِ mihrab حيّةً فعلًا — الحارسُ نظر
            # حيث لا يمكن أن يجد. وبلا زيغوتٍ يحمل كلُّ ابنٍ سطرَ أوامره الصادق.
            xvfb-run -a "$MAIN" --no-sandbox --no-zygote --disable-gpu \
              --disable-dev-shm-usage --verbose \
              --user-data-dir=/tmp/mihrab-ud --extensions-dir=/tmp/mihrab-ext \
              /tmp > /tmp/boot.log 2>&1 &
            PID=$!

            # استطلاعٌ لا نومٌ ثابت: العدّاءُ قد يكون بطيئًا، والانتظارُ الأعمى
            # يقايض عطبًا حقيقيًّا بعطبٍ متقطّع. ٦٠ ثانيةً سقفًا، والنجاحُ فوريّ.
            RENDERER=""
            for _ in $(seq 60); do
              if ! kill -0 "$PID" 2>/dev/null; then
                wait "$PID"; RC=$?
                echo "❌ مات التطبيق بعد الإقلاع (خرج $RC):"
                tail -40 /tmp/boot.log || true
                exit 1
              fi
              # القراءةُ من /proc مباشرةً: cmdline مفصولٌ بـNUL، وpgrep قد يقصّه.
              for c in /proc/[0-9]*/cmdline; do
                tr '\0' ' ' < "$c" 2>/dev/null | grep -q -- '--type=renderer' \
                  && { RENDERER="${c%/cmdline}"; break; }
              done
              [[ -n "$RENDERER" ]] && break
              sleep 1
            done

            if [[ -z "$RENDERER" ]]; then
              echo "❌ لا عمليّةَ عرض بعد ٦٠ ثانية — لم تُرفع نافذة:"
              ps -ef | grep -i mihrab | grep -v grep || true
              tail -40 /tmp/boot.log || true
              kill "$PID" 2>/dev/null || true
              exit 1
            fi
            kill "$PID" 2>/dev/null || true
            echo "✅ النافذةُ أقلعت، وعمليّةُ العرض حيّة (${RENDERER##*/})"
          fi

      - name: بصمةُ الإصدار
        id: stamp
        run: |
          OUT=".upstream/${{ matrix.out }}"
          # ‏[Rr] لا `resources`: macOS يكتبها `Contents/Resources/app`، وlinux/win
          # يكتبانها صغيرة. ومطابقةُ حالةِ الأحرف أسقطت بناءَ macOS **الناجح**
          # في خطوةِ بصمةٍ لا في البناء — فشلٌ في الحارس لا في المحروس.
          APP=$(find "$OUT" -path '*/[Rr]esources/app/product.json' -print -quit)
          test -n "$APP" || { echo "❌ لم يُعثر على product.json المشحون في $OUT"; exit 1; }
          V=$(python -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['version'])" "$APP")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "الإصدار: $V"

      # ── التغليف ──
      # كان `case` من ثلاثة أسطرٍ هنا: أرشيفٌ واحدٌ لكلّ منصّة. وصار مُغلِّفًا
      # مستقلًّا — `build/package_assets.sh` — لثلاثة أسباب: يُشغَّل على جهاز
      # مطوّرٍ فيُختبَر، ويحرسه [PKG-01]، ووصفةُ الحزم (‏deb ‏· rpm ‏· Inno) أطولُ
      # من أن تعيش في YAML. واسمُ الملفّ اسمُ الأصل في مانيفست الموقع، فلا
      # يحتاج الرفعُ لاحقًا ترجمةَ أسماء.
      - name: تغليف
        run: bash build/package_assets.sh ${{ matrix.assets }}
        env:
          # ‏**`MIHRAB_ARCH` هنا كما في خطوة البناء.** المُغلِّفُ يستدعي
          # `build.sh --platform` ليعرف المنصّةَ — وهو يكشف معماريّةَ **المضيف**
          # بـ`uname -m` ما لم يُصرَّح له. فبلا هذا السطر تجيب وظيفةُ
          # `ويندوز arm64` بـ`windows/x64`، فيُطلَب مخرَجٌ اسمُه
          # `VSCode-win32-x64` لا وجودَ له (البناءُ أخرج `…-arm64`) وتسقط
          # الوظيفةُ بعد ساعةِ بناءٍ كاملة. قِيس: `MIHRAB_ARCH=arm64 bash
          # build/build.sh --platform` ⇒ `windows/arm64 out=VSCode-win32-arm64`.
          MIHRAB_ARCH: ${{ matrix.arch }}
          # لاحقةُ المعاينة في الاسمِ لا في مكانِ الرفعِ وحدَه: ملفٌّ يُنزَّل ويُعاد
          # مشاركتُه ينفصل عن صفحتِه، فيجب أن يقول عن نفسِه إنّه معاينةٌ لا إصدار.
          MIHRAB_ASSET_SUFFIX: ${{ inputs.preview_alif && '-alif' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: mihrab${{ inputs.preview_alif && '-alif' || '' }}-${{ matrix.arch }}-${{ runner.os }}
          path: dist/*
          retention-days: 14
          compression-level: 0   # مضغوطٌ سلفًا؛ إعادةُ الضغط دقائقُ بلا مكسب
