# محرابُ المتصفّح **الثابت** — كتلُ 443. لا خادمَ خلفها، ولا عمليّةَ تعمل.
#
# يحلّ محلَّ `mihrab.dev.conf` (الوسيطِ إلى `vscode-reh-web`). والفرقُ ليس تحسينًا:
# ذاك كان يفتح **نظامَ ملفّاتٍ وطرفيّةً** على الخادم خلف عنوانٍ عامّ، مهما أُحكِم
# رمزُ الاتّصال. وهذا ملفّاتٌ ثابتةٌ فقط — والملفّاتُ من جهاز الزائر عبر
# ‏File System Access. سطحُ الهجومِ الذي كان يُقلِق زال ولم يُقلَّل.
#
# ⚠️⚠️ **موضعُه `sites-enabled/mihrab` لا `conf.d/`.** ‏`nginx.conf` على هذا الخادم
# يُدرِج `conf.d/*.conf` **ثمّ** `sites-enabled/*`، ولا كتلةَ `default_server` على
# 443 في أيٍّ منها (قِيس). فالخادمُ الافتراضيُّ أوّلُ كتلةٍ بترتيب التحليل — وهي
# اليومَ `kadah`. ووضعُ هذا في `conf.d/` يجعله يسبقها فيصير محرابٌ الافتراضيَّ
# لكلّ `Host` مجهول. و«mihrab» يلي «kadah» أبجديًّا فالترتيبُ سليم.
#
# ولم يعد يعتمد على `00-mihrab-shared.conf` إلّا في `limit_conn_zone`: لا وسيطَ
# ⇒ لا `upstream` ولا `map $http_upgrade`. يبقى الملفُّ حيث هو بلا ضرر.

# ── www ⇒ الجذر: عنوانٌ واحدٌ للمشروع لا اثنان ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ **لا `http2` بأيّ صيغة.** قِيس: nginx 1.24.0 هنا، والتوجيهُ المستقلُّ
    #    `http2 on;` وُلد في 1.25.1 ⇒ «unknown directive» فيسقط الملفُّ ولا يقلع
    #    nginx. والصيغةُ القديمة لا تلزم: `kadah` تضع `listen 443 ssl http2;`
    #    وخيارُ المقبس يسري على المقبس كلِّه ⇒ HTTP/2 مفعَّلٌ سلفًا (قِيس: %{http_version}=2).
    server_name www.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://mihrab.dev$request_uri;
}

# ── محراب ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;

    # بلا هذا الإدراج تسقط الكتلةُ إلى افتراضيّاتِ nginx — وقد تشمل TLSv1/1.1.
    # كتلةُ `sad-lang.org` تُدرِج القصاصةَ على مستواها هي، ولا تُورَث.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # ⛔ **لا `ssl_session_*` هنا.** القصاصةُ أعلاه تضع الثلاثةَ (قِيست)، وnginx يرفض
    #    التكرارَ بـ«directive is duplicate» فلا يقلع. أُوقِع فعلًا وأنقذته البوّابةُ
    #    التلقائيّة. و`ssl_dhparam` يبقى: القصاصةُ لا تضعه (قِيس: صفرُ ذكر).
    # ⛔ لا `ssl_stapling`: أنهت Let's Encrypt خدمةَ OCSP وأزالت روابطَ المستجيب (2025).

    server_tokens off;
    access_log /var/log/nginx/mihrab.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab.error.log warn;

    root /opt/mihrab/static;
    index index.html;

    # لا رفعَ إلى هذا الموقع أصلًا — لا خادمَ يستقبل. السقفُ الصغيرُ يمنع طلبًا
    # ضخمًا من إشغال القرص الذي يخدم `sad-lang.org` كذلك.
    client_max_body_size 1m;
    limit_conn mihrab_conn 64;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    # ⛔ **لا كتلةَ `types` هنا.** كانت هنا واحدةٌ تضيف `wasm`/`woff2` — وهذا خطأٌ
    #    في فهم التوجيه: `types` على مستوى `server` **يستبدل** الجدولَ الموروث ولا
    #    يوسّعه. فصار كلُّ ما عداها `application/octet-stream`: الصفحةُ نفسُها،
    #    و`boot.js`، والورقة. ومع `nosniff` يرفض المتصفّحُ تنفيذَ الوحدات ⇒ موقعٌ
    #    أبيضُ بلا رسالةِ خطأ. أُوقِع حيًّا وقِيس بـ`curl -I`.
    #    و`/etc/nginx/mime.types` على هذا الخادم يغطّي الاثنين سلفًا (قِيس:
    #    `application/wasm wasm` سطر 55 · `font/woff2 woff2` سطر 29)، فلا حاجةَ أصلًا.

    # ── طبقةُ العزل: روابطُ المنتَج تشير إلى نطاقِنا لا إلى GitHub خامًا ──
    # علّتُها أنّ هذه الروابط تُطبَع في ثنائيّاتٍ موقَّعةٍ وإصداراتٍ ماضيةٍ لا تُستردّ.
    location = /issues     { return 301 https://github.com/mihrab-org/mihrab/issues; }
    location = /issues/new { return 301 https://github.com/mihrab-org/mihrab/issues/new; }
    location = /license    { return 301 https://github.com/mihrab-org/mihrab/blob/main/LICENSE; }
    location = /releases   { return 301 https://github.com/mihrab-org/mihrab/releases; }
    location = /repo       { return 301 https://github.com/mihrab-org/mihrab; }

    # الحزمةُ محتواها مبصومٌ بالبناء ولا يتغيّر تحت الاسم نفسِه ⇒ `immutable`.
    # ‏17 م.ب في كلّ زيارةٍ بلا هذا، وهو أثقلُ ما في التجربة.
    location /out/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # ⚠️ **مكرَّرةٌ هنا عمدًا.** `add_header` يُورَث من الأعلى فقط إن لم يوجد أيُّ
        # `add_header` في المستوى الحاليّ — فالتصريحُ هنا يمنع تبخّرَها يومَ يضيف
        # أحدُهم ترويسةً واحدةً في هذه الكتلة.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # صفحةُ المضيف وإعدادُ المنتَج يتغيّران مع كلّ نشرٍ تحت الاسم نفسِه ⇒ لا تُخزَّن.
        add_header Cache-Control             "no-cache" always;

        # ‏`=404` لا `/index.html`: لا توجيهَ مسارٍ في هذا البناء، وإرجاعُ الصفحة
        # مكانَ أصلٍ مفقودٍ يُنتج خطأَ نوعِ MIME بدل 404 صريح — عطبٌ يصعب تشخيصُه.
        try_files $uri $uri/ =404;
    }

    # ⚠️ **لا `Content-Security-Policy` بعد** — وهذا نقصٌ مُعلَنٌ لا سهو.
    #    كان الخادمُ يرسلها بنفسه، ولا خادمَ الآن. وسياسةٌ خاطئةٌ تكسر الورشةَ
    #    (عمّالُ blob:، وwasm، وأُطُرُ الـwebview) كسرًا صامتًا. تُضاف بعد قياسٍ
    #    في متصفّحٍ حقيقيّ لا بالتخمين. ويخفّف الأثرَ أنّ الموقعَ ملفّاتٌ ثابتةٌ
    #    لا يُصيَّر فيها إدخالُ مستخدمٍ على الخادم.
    # ⛔ ولا `Cross-Origin-Embedder-Policy` ولا `Cross-Origin-Opener-Policy`:
    #    يكسران الـwebviews (أُطُرٌ بحكم التصميم).
}
