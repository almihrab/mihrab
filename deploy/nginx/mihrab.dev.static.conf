# محرابُ المتصفّح **الثابت** — كتلُ 443. لا خادمَ خلفها، ولا عمليّةَ تعمل.
#
# يحلّ محلَّ `mihrab.dev.conf` (الوسيطِ إلى `vscode-reh-web`). والفرقُ ليس تحسينًا:
# ذاك كان يفتح **نظامَ ملفّاتٍ وطرفيّةً** على الخادم خلف عنوانٍ عامّ، مهما أُحكِم
# رمزُ الاتّصال. وهذا ملفّاتٌ ثابتةٌ فقط — والملفّاتُ من جهاز الزائر عبر
# ‏File System Access. سطحُ الهجومِ الذي كان يُقلِق زال ولم يُقلَّل.
#
# ⚠️⚠️ **موضعُه `sites-enabled/mihrab` لا `conf.d/`.** ‏`nginx.conf` على هذا الخادم
# يُدرِج `conf.d/*.conf` **ثمّ** `sites-enabled/*`، ولا كتلةَ `default_server` على
# 443 في أيٍّ منها (قِيس). فالخادمُ الافتراضيُّ أوّلُ كتلةٍ بترتيب التحليل — وهي
# اليومَ `kadah`. ووضعُ هذا في `conf.d/` يجعله يسبقها فيصير محرابٌ الافتراضيَّ
# لكلّ `Host` مجهول. و«mihrab» يلي «kadah» أبجديًّا فالترتيبُ سليم.
#
# ولم يعد يعتمد على `00-mihrab-shared.conf` إلّا في `limit_conn_zone`: لا وسيطَ
# ⇒ لا `upstream` ولا `map $http_upgrade`. يبقى الملفُّ حيث هو بلا ضرر.

# ── www ⇒ الجذر: عنوانٌ واحدٌ للمشروع لا اثنان ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ **لا `http2` بأيّ صيغة.** قِيس: nginx 1.24.0 هنا، والتوجيهُ المستقلُّ
    #    `http2 on;` وُلد في 1.25.1 ⇒ «unknown directive» فيسقط الملفُّ ولا يقلع
    #    nginx. والصيغةُ القديمة لا تلزم: `kadah` تضع `listen 443 ssl http2;`
    #    وخيارُ المقبس يسري على المقبس كلِّه ⇒ HTTP/2 مفعَّلٌ سلفًا (قِيس: %{http_version}=2).
    server_name www.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://mihrab.dev$request_uri;
}

# ── محراب ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;

    # بلا هذا الإدراج تسقط الكتلةُ إلى افتراضيّاتِ nginx — وقد تشمل TLSv1/1.1.
    # كتلةُ `sad-lang.org` تُدرِج القصاصةَ على مستواها هي، ولا تُورَث.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # ⛔ **لا `ssl_session_*` هنا.** القصاصةُ أعلاه تضع الثلاثةَ (قِيست)، وnginx يرفض
    #    التكرارَ بـ«directive is duplicate» فلا يقلع. أُوقِع فعلًا وأنقذته البوّابةُ
    #    التلقائيّة. و`ssl_dhparam` يبقى: القصاصةُ لا تضعه (قِيس: صفرُ ذكر).
    # ⛔ لا `ssl_stapling`: أنهت Let's Encrypt خدمةَ OCSP وأزالت روابطَ المستجيب (2025).

    server_tokens off;
    access_log /var/log/nginx/mihrab.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab.error.log warn;

    # ── الجذرُ هو **الموقعُ التعريفيّ**، لا المحرِّر ──
    # كان المحرِّرُ نفسُه على الجذر: من طرق الاسمَ لأوّل مرّةٍ يُنزَّل عليه أربعةُ
    # ميغاباياتٍ ونيّف من ورشةٍ قبل أن يعرف ما محراب. وانتقل إلى `app.mihrab.dev`
    # في الكتلة الأخيرة من هذا الملفّ.
    #
    # **والفصلُ بالأصل لا بالمسار**: الأصلُ مخطَّطٌ ومضيفٌ ومنفذ — والمسارُ ليس منه.
    # فالورشةُ تحتاج `script-src 'unsafe-eval'` (مضيفُ الامتدادات يبني الوحداتِ
    # بـ`new Function`)، وصفحاتُ التعريف لا تحتاجها؛ ومسارٌ تحت جذرٍ واحدٍ يمنحها
    # الرخصةَ نفسَها ويجعل تخزينَ المحرِّر (‏IndexedDB · مقابضُ المجلّدات) في متناول
    # أيّ سكربتٍ على صفحةٍ تسويقيّة.
    root /opt/mihrab/site;
    index index.html;

    # لا رفعَ إلى هذا الموقع أصلًا — لا خادمَ يستقبل. السقفُ الصغيرُ يمنع طلبًا
    # ضخمًا من إشغال القرص الذي يخدم `sad-lang.org` كذلك.
    client_max_body_size 1m;
    limit_conn mihrab_conn 64;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json
               # ملاحظاتُ الإصدار عربيّةٌ كلُّها — بايتان لكلّ محرف، فالضغطُ عليها أعلى ممّا
               # يبدو من حجمها. وبلا هذا السطر تُخدَم خامًّا في كلّ فتحةِ ملاحظات.
               text/markdown;

    # ⛔ **لا كتلةَ `types` هنا.** كانت هنا واحدةٌ تضيف `wasm`/`woff2` — وهذا خطأٌ
    #    في فهم التوجيه: `types` على مستوى `server` **يستبدل** الجدولَ الموروث ولا
    #    يوسّعه. فصار كلُّ ما عداها `application/octet-stream`: الصفحةُ نفسُها،
    #    و`boot.js`، والورقة. ومع `nosniff` يرفض المتصفّحُ تنفيذَ الوحدات ⇒ موقعٌ
    #    أبيضُ بلا رسالةِ خطأ. أُوقِع حيًّا وقِيس بـ`curl -I`.
    #    و`/etc/nginx/mime.types` على هذا الخادم يغطّي الاثنين سلفًا (قِيس:
    #    `application/wasm wasm` سطر 55 · `font/woff2 woff2` سطر 29)، فلا حاجةَ أصلًا.

    # ── طبقةُ العزل: روابطُ المنتَج تشير إلى نطاقِنا لا إلى GitHub خامًا ──
    # علّتُها أنّ هذه الروابط تُطبَع في ثنائيّاتٍ موقَّعةٍ وإصداراتٍ ماضيةٍ لا تُستردّ.
    location = /issues     { return 301 https://github.com/almihrab/mihrab/issues; }
    location = /issues/new { return 301 https://github.com/almihrab/mihrab/issues/new; }
    location = /license    { return 301 https://github.com/almihrab/mihrab/blob/main/LICENSE; }
    location = /releases   { return 301 https://github.com/almihrab/mihrab/releases; }
    location = /repo       { return 301 https://github.com/almihrab/mihrab; }

    # ── والشكلُ المساريُّ للأسماء الفرعيّة: الإنسانُ يخمّن المسارَ لا التسمية ──
    # من عرف `mihrab.dev` يكتب `mihrab.dev/download` قبل أن يخطر له `dl.mihrab.dev`
    # بكثير. وبلا هذه الأسطر يلقاه ‎404‎ nginx العاري: إنجليزيٌّ، يساريٌّ، يقول «nginx»
    # — على منتَجٍ كلُّ دعواه الاتّجاهُ والعربيّة، وفي لحظةِ الخطأ حيث تُختبَر العناية.
    #
    # وكانت هنا ثلاثةُ تحويلاتٍ إلى التسميات الفرعيّة، لأنّ الجذرَ كان للمحرِّر
    # ولا صفحاتِ توثيقٍ فيه. زالت الحاجةُ: `/docs/` و`/download/` و`/dl/` مجلّداتٌ
    # حقيقيّةٌ في جذر الموقع الآن، و`try_files` أدناه يخدمها. والتسمياتُ الفرعيّةُ
    # صارت تحوّل إلى هنا لا العكس (انظر `mihrab.dev.subdomains.conf`).

    # ── ⑂ عناوينُ الورشة **انتقلت، ولم تَضِع** ──
    # كان `mihrab.dev` هو المحرِّرَ نفسَه قبل أسابيع. فكلُّ إشارةٍ مرجعيّةٍ حُفِظت
    # حينها — وكلُّ عاملِ خدمةٍ مسجَّلٍ في متصفّحٍ لم يُفتَح منذُها — تقصد مساراتٍ
    # هي اليومَ على `app.mihrab.dev` حرفًا بحرف.
    #
    # و‎404‎ جوابٌ **خاطئ** لها: المورِدُ موجودٌ وله عنوانٌ جديد، وهذا تعريفُ ‎301‎.
    # والفرقُ عند الزائر: نافذةٌ تفتح على محرابٍ يعمل، بدل صفحةٍ تقول «لا شيءَ هنا»
    # عن شيءٍ موجود.
    #
    # ‏`^~` لا تعبيرٌ نمطيّ: البادئةُ تسبق كلَّ regex في ترتيب nginx، فلا يسرقها
    # مطابِقٌ آخرُ يُضاف لاحقًا. و`$request_uri` يحمل المسارَ والاستعلامَ كما وردا.
    location ^~ /out/            { return 301 https://app.mihrab.dev$request_uri; }
    location = /workbench.html   { return 301 https://app.mihrab.dev$request_uri; }
    location = /manifest.json    { return 301 https://app.mihrab.dev$request_uri; }
    location = /product.web.js   { return 301 https://app.mihrab.dev$request_uri; }
    location = /boot.js          { return 301 https://app.mihrab.dev$request_uri; }
    location = /boot-early.js    { return 301 https://app.mihrab.dev$request_uri; }

    # ── وما ليس له عنوانٌ جديد: صفحةُ خطأٍ عربيّة ──
    # كان الجوابُ `<title>404 Not Found</title>…<center>nginx</center>`: إنجليزيٌّ،
    # يساريٌّ، يقول «nginx» — على منتَجٍ كلُّ دعواه الاتّجاهُ والعربيّة، وفي اللحظة
    # التي تُختبَر فيها العناية. والتحذيرُ من ذلك كان مكتوبًا في هذا الملفّ أعلاه
    # منذ أسابيع: كُتب الحذرُ ولم تُكتَب الصفحة.
    #
    # `internal` شرطٌ لا زينة: بدونه يصير `/404.html` عنوانًا عامًّا يُطلَب مباشرةً
    # فيردّ **‎200‎** بصفحةِ خطأ — ومحرِّكاتُ البحث تفهرسه صفحةً حقيقيّة.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # ⚠️ **والترويساتُ الخمسُ تُعاد هنا حرفًا بحرف.** والتعليلُ ليس أنّ هذه
        #    الكتلةَ ترث من `location /` — هما **أختان** لا أمٌّ وبنت، ولا وراثةَ
        #    بينهما أصلًا. بل لأنّ `add_header` في `location` يُلغي وراثةَ
        #    `server`؛ ولا `add_header` على مستوى `server` في هذا الملفّ، فكتلةٌ
        #    بلا ترويساتٍ خاصّةٍ بها تخرج **بلا ترويسةٍ واحدة** — لا بلا السياسة
        #    وحدَها. والنتيجةُ التي كُتبت أوّلًا صحيحةٌ والطريقُ إليها كان خطأً.
        #    ويحرسها [CSP-01] الآن: كلُّ `location` تخدم محتوًى وتضيف ترويسةً
        #    يجب أن تحمل سياسةً، والاستثناءان مسمَّيان في الحارس.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # ── ⛔ لا `immutable` هنا، ولا سنة ──
    # كان: `max-age=31536000, immutable` بحجّة «المحتوى مبصومٌ بالبناء». **وهو ليس
    # مبصومًا**: `index.html` يصل `out/nls.messages.js` و`workbench.web.main.internal.css`
    # بأسماءَ ثابتةٍ لا تتغيّر بين البناءات (وبوّابةُ `static_deploy.sh` تفحص المسارات
    # نفسَها حرفيًّا عبر البناءات — لو كانت مبصومةً لَما صحّ ذلك).
    #
    # والأثرُ ليس بطئًا بل **كسرٌ مؤجَّل**: زائرٌ خزّن `/out/*` سنةً، ثمّ نُشِر بناءٌ
    # جديد. صفحتُه تُجدَّد (`no-cache`) وحزمتُه **لا تُطلَب أصلًا** — و`immutable`
    # تُلغي إعادةَ التحقّق حتّى مع `Ctrl+R`. صفحةُ إقلاعٍ جديدةٌ فوق حزمةٍ قديمة،
    # وإصلاحٌ أمنيٌّ لا يبلغ زائرًا عائدًا إلى سنةٍ من الآن.
    #
    # وكانت هنا عشرُ دقائقَ ومراجعةٌ بعدها. **أسقطتها نافذةُ العمى**، ولم تُسقِطها
    # نظريّة: نُشِرت `sad-lang` فلم تُلوِّن عند المُبلِّغ. والعلّةُ أنّ قائمةَ الامتدادات
    # المضمَّنة **مخبوزةٌ داخل الحزمة نفسِها** (`builtinExtensionsScannerService.ts:56`:
    # `bundledExtensions = [/*BUILD->INSERT_BUILTIN_EXTENSIONS*/]`) — فحزمةٌ مخزَّنةٌ
    # عمرُها دقائقُ لا تعرف اللغةَ الجديدة **إطلاقًا**، لا أنّها تعرفها بلا قواعد.
    # وأيُّ طزاجةٍ موجبةٍ تُنتج النافذةَ نفسَها، أقصرَ لا غير.
    #
    # والثمنُ **مقيسٌ لا مقدَّر**: إقلاعٌ باردٌ حقيقيٌّ من `mihrab.access.log` =
    # ‏١٠ طلبات `/out/` (زائرٌ خارجيّ: ‎21‎ طلبًا · ‎5.54‎ م.ب). فالعائدُ يدفع عشرَ
    # مراجعاتٍ مشروطة، وقِيست على هذا الخادم: **304 بصفرِ بايت** لبصمةٍ ضعيفةٍ
    # وقويّةٍ، بضغطٍ وبلا ضغط، ولـ`If-Modified-Since` كذلك.
    #
    # ⚠️ ولا تُكتَب `max-age=0, must-revalidate` مكانَها: صياغتان لعقدٍ واحدٍ في ملفٍّ
    #    واحدٍ تفترقان بصمت. والحارسُ يقيس **العقدَ** — عمرَ الطزاجة صفرًا — لا الكلمة،
    #    فأيُّ الصياغتَين كُتِبت مرّت.
    #
    # ⛔ **ولا يُبصَم المسار** (‏`/out-<hash>/`) — دُرِس وسقط، والدَّينُ يُغلَق لا يُؤجَّل:
    #    `network.ts:271-272` يحلّ `builtinExtensionsPath = 'vs/../../extensions'`
    #    بالصعود مستويَين من جذر الملفّات، فبصمُ `/out/` يُخرِج `/extensions/`
    #    و`/node_modules/` من البصمة بحكم الحساب — أي يبصم الشجرةَ التي لم تُعطِبنا
    #    ويترك التي فيها قواعدُ التلوين و`onig.wasm`. ويُنتج فوقَ ذلك عمّالَ خدمةٍ
    #    يتيمة: `pre/index.html:256` يسجّل عاملًا نطاقُه داخل `/out/`، ولا أحدَ
    #    يستدعي `unregister()` على نطاقٍ زال — تسجيلٌ يبقى عن كلّ نشرٍ مضى.
    # ── `/dl/` مخزنُ ثنائيّاتٍ بلا فهرس ──
    # `deploy_site.sh` يستثنيه من بناء الموقع عمدًا (الثنائيّاتُ تُرفَع ولا تُبنى)،
    # فلا `index.html` فيه — والمجرَّدُ كان يردّ ‎403‎ «Forbidden» بالإنجليزيّة من
    # nginx العاري، وهو أسوأُ ما يُقدَّم لمن قصد التنزيل. والرابطُ العميقُ إلى ملفٍّ
    # يعمل كما هو: هذه الكتلةُ تطابق المسارَ المجرَّدَ وحدَه (`=`).
    #
    # ⛔ ولا `autoindex on`: سردُ مجلّدٍ يكشف كلَّ بناءٍ قديمٍ بقي على القرص، ويقدّم
    #    للزائر جدولًا بلا بصماتٍ ولا سياق — وصفحةُ التنزيل تحمل البصماتِ والأحجام.
    location = /dl/ {
        return 302 https://mihrab.dev/download/;
    }
    # ومجلّدُ المعاينة كذلك: كان يردّ ‎403‎ (قياسُ مدير المنتج) والصفحةُ في `/preview/alif/`.
    location = /dl/preview-alif/ {
        return 302 https://mihrab.dev/preview/alif/;
    }

    # ملاحظاتُ الإصدار: نصٌّ خامٌّ يطلبه محرِّرُ الملاحظات داخل التطبيق
    # (‏`<releaseNotesBaseUrl>/v<كبير>_<صغير>.md` — انظر `product-overrides/product.json`).
    #
    # **`alias` إلى مجلّدٍ خارج جذر الحمولة عمدًا:** النشرُ الثابت يبدّل
    # ⚠️ **ولا تُحذَف هذه الكتلةُ وإن انتقلت القاعدةُ إلى `app.mihrab.dev`**: كلُّ
    # ثنائيٍّ شُحِن قبل الانتقال يحمل `https://mihrab.dev/notes` **مخبوزًا في
    # `product.json` داخله** — لا يبلغه تحويلٌ ولا تحديثُ خادم. فحذفُها يُسكِت
    # ملاحظاتِ الإصدار عند كلّ من نزّل محرابًا قبل اليوم، وهم كلُّ المستخدِمين.
    #
    # `/opt/mihrab/static` كتلةً واحدةً ذرّيًّا، فملاحظاتٌ داخله تختفي مع أوّل نشرِ
    # بناءٍ لا يحملها — وعمرُ الملاحظات أطولُ من عمر الحمولة: تُنشَر مرّةً وتبقى
    # لكلّ بناءٍ من الإصدار نفسِه، ويقرؤها من لم يحدّث بعد.
    #
    # و`text/markdown` صراحةً: خرائطُ الأنواع لا تعرف `.md` فتُرسَل
    # `application/octet-stream`، و`nosniff` أعلاه يمنع التخمين — فيصير الملفُّ
    # تنزيلًا في المتصفّح بدل نصٍّ يُقرأ (يهمّ نسخةَ المتصفّح: `IRequestService`
    # فيها `fetch` لا طلبٌ من Node).
    location /notes/ {
        alias /opt/mihrab/notes/;
        default_type text/markdown;
        charset utf-8;
        # ‏`charset_types` **يستبدل** القائمةَ الافتراضيّة ولا يضيف إليها — العلّةُ نفسُها
        # الموثَّقةُ أعلاه عن `types`. فتُذكَر الأنواعُ الأخرى معه، وإلّا فقدَ أوّلُ ملفٍّ
        # غيرِ `.md` يوضَع هنا ترميزَه.
        # ⛔ ولا `text/html` في القائمة: nginx يضعه فيها **دائمًا** ولا يقبل تكرارَه،
        #    فيطبع «duplicate MIME type» في كلّ `nginx -t`. وتحذيرٌ دائمٌ لا يُقرأ
        #    بعد أوّل مرّة — فيمرّ معه يومًا تحذيرٌ يعني شيئًا. قِيس على الخادم.
        charset_types text/markdown text/plain text/css application/javascript;
        add_header Cache-Control "public, max-age=300" always;
        # **وهذه الترويسةُ هي الفرقُ بين ميزةٍ تعمل وميزةٍ لا تعمل.** طلبُ الملاحظات يجري
        # بـ`fetch` في عارضِ التطبيق، وأصلُه `vscode-file://vscode-app` — أي طلبٌ عابرُ أصلٍ
        # تحكمه CORS. قِيس حيًّا من داخل محراب: `code.visualstudio.com/raw` يُجيب ‎200‎
        # (يُرسِل الترويسةَ لهذا الأصل بعينه)، و`mihrab.dev` يسقط بـ`Failed to fetch`
        # **رغم أنّه يردّ ‎200‎ لـcurl**. فمن تحقّق بـcurl وحدَه أعلن نجاحًا على خادمٍ مكسور.
        # و`*` مقبولةٌ هنا: نصٌّ عامٌّ للقراءة، بلا كعكةٍ ولا اعتماد. ونسخةُ المتصفّح تقرؤه
        # من أصله نفسِه فلا تحتاجها أصلًا.
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options    "nosniff" always;
        # مكرَّرةٌ عمدًا: `add_header` في هذا المستوى يلغي وراثةَ ما فوقه.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # ملفُّ رفعٍ منقطعٍ يبقى باسمٍ مخفيّ (`.v1_126.md.part`) — وnginx يخدم المخفيَّ
        # افتراضًا. لا يُخمَّن الاسمُ عادةً، لكنّ نصفَ مستندٍ يُقدَّم لقارئٍ خطأٌ لا مبرّرَ له.
        location ~ /\. { return 404; }
        try_files $uri =404;
    }

    # ── خطوطُ الويب: `Access-Control-Allow-Origin` شرطُ عملٍ لا تحسين ──
    # صفحةُ ‎404‎ مشتركةٌ بين الأصلين بـ`alias`، وأصولُها مطلقةٌ بـ`https://mihrab.dev`.
    # فحين تُقدَّم من `app.mihrab.dev` تُحمَّل `fonts.css` من هنا، و`@font-face`
    # داخلَها يحلّ `url("fonts/…")` نسبةً إلى **موقع الورقة** — أي إلى هذا الأصل.
    #
    # وجلبُ الخطوط **عابرَ الأصل تحكمه CORS لا CSP وحدَها**: `font-src` في سياسة
    # تلك الكتلة تسمح بالمضيف، ثمّ يرفض المتصفّحُ الملفَّ لغياب هذه الترويسة —
    # فتصل صفحةُ الإنقاذ بخطّ النظام بينما نظيرتُها على الجذر سليمة. وهذا الشرطُ
    # كان مكتوبًا في تعليق كتلة ‎404‎ معلَّقًا على «من ورّد فليضِفها»، ووُرِّدت ولم يُضَف.
    #
    # ولماذا كتلةٌ مستقلّةٌ لا سطرٌ في `location /`: الترويسةُ تخصّ **الخطوطَ
    # وحدَها**، ومنحُها لكلّ ما تحت الجذر يُتيح لأيّ صفحةٍ في الويب قراءةَ
    # مخرَجنا بجافاسكربت — توسيعٌ بلا داعٍ لأجل أربعة ملفّات.
    #
    # والترويساتُ الستُّ مكرَّرةٌ هنا كاملةً: `add_header` في الموضِع **يُلغي
    # وراثةَ ما فوقه**، ولا `add_header` على مستوى `server` في هذا الملفّ — فكتلةٌ
    # بترويسةٍ واحدةٍ تخرج بواحدةٍ لا بستّ. ويحرس السياسةَ منها [CSP-01].
    #
    # ⚠️ **وأمّا `Access-Control-Allow-Origin` فيحرسها [CORS-01]** — وكان هذا
    # السطرُ يزعم أنّ [CSP-01] و[W404] يحرسانها، وهو زعمٌ كاذب: الأوّلُ لا يرى
    # إلّا السياسة، والثاني لا يقرأ هذا الموضِعَ إطلاقًا. وأربعُ طفراتٍ أثبتته:
    # حذفُ الترويسة · حذفُ الكتلة · قصرُها على مضيفٍ غريب · نقلُها إلى الكتلة
    # الخطأ — أربعتُها مرّت خضراء. **ووعدُ حراسةٍ لا وجودَ لها أخطرُ من غياب
    # الحارس**: مراجعٌ قادمٌ يقرأ الوعدَ فلا يبني الحارس. فكُتِب الحارس.
    location ^~ /assets/fonts/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # ── يومٌ واحدٌ لا شهر: **الاسمُ ثابتٌ غيرُ مُعنوَنٍ بالمحتوى** ──
        # كتبتُ ‎٣٠‎ يومًا أوّلًا بحجّة «الخطوطُ لا تتغيّر»، فأحمرّ [DEP-02] محقًّا:
        # `plex-arabic-400.woff2` اسمٌ ثابت، فتحديثُ الوجه لا يبلغ زائرًا عائدًا
        # حتّى تنتهي المدّة — وهو العطبُ نفسُه الذي مُنِع في `/out/`. ويومٌ يكفي
        # مكسبَ التخزين (الزيارةُ الثانيةُ في الجلسة نفسِها بلا تنزيل) ويُبقي
        # أطولَ انحرافٍ ممكنٍ ‎٢٤‎ ساعةً لا شهرًا.
        # ومن أراد عمرًا أطولَ فليُعنوِن الاسمَ بالمحتوى (بصمةٌ في اسم الملفّ)،
        # و`EXPECT_FACES` في [FNT-01] يحمل البصمةَ سلفًا فالخطوةُ قصيرة.
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        # ⚠️ **مكرَّرةٌ هنا عمدًا.** `add_header` يُورَث من الأعلى فقط إن لم يوجد أيُّ
        # `add_header` في المستوى الحاليّ — فالتصريحُ هنا يمنع تبخّرَها يومَ يضيف
        # أحدُهم ترويسةً واحدةً في هذه الكتلة.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # صفحةُ المضيف وإعدادُ المنتَج يتغيّران مع كلّ نشرٍ تحت الاسم نفسِه ⇒ لا تُخزَّن.
        add_header Cache-Control             "no-cache" always;

        # ── [CSP-01] سياسةُ أمان المحتوى ────────────────────────────────────
        # **قِيست ولم تُخمَّن.** أُرسلت أوّلًا `Report-Only` على الشجرة المبنيّة في
        # إدج نظيف، وجُمِعت مخالفاتُها عبر CDP، ثمّ أُغلِقت وأُعيد القياس: الورشةُ
        # تُقلِع، ومضيفُ الامتدادات حيٌّ (أوامرُ «محراب:» و«ص:» في لوحة الأوامر)،
        # وصفرُ طلباتٍ فاشلة، وصفرُ مخالفات.
        #
        # وثلاثةُ دروسٍ من القياس، كلٌّ منها كان سيكسر الموقعَ لو خُمِّن:
        #
        # ‏(١) **الترويسةُ هنا لا في `/out/`.** تحت `/out/` مستندان يحملان سياستَيهما
        #     المنبعيّتَين — إطارُ مضيف الامتدادات وصفحةُ الـwebview — وكلاهما يشغّل
        #     سكربتًا داخليًّا بحكم تصميمه. وسياستُنا تتقاطع معهما لا تحلّ محلَّهما،
        #     فإرسالُها هناك يقتل مضيفَ الامتدادات: الورشةُ تُقلِع، والسمةُ تُرسَم،
        #     ولا امتدادَ يعمل — عطبٌ **بلا صفحةٍ بيضاء**. وبقيّةُ `/out/` أصولٌ لا
        #     مستندات، ولا تُطبَّق عليها سياسةٌ أصلًا.
        #
        # ‏(٢) **`openvsx.eclipsecontent.org`** شبكةُ توصيل Open VSX. لم تكن في أوّل
        #     صياغةٍ للسياسة، وكانت ستمنع تنزيلَ حزمة اللغة العربيّة صامتةً.
        #
        # ‏(٣) **لا `'unsafe-inline'` في `script-src`** — وثمنُ ذلك أنّ سكربتَ الإقلاع
        #     خرج من `index.html` إلى `boot-early.js` [WEB-09]. والبديلان مرفوضان:
        #     النونس يحتاج خادمًا يولّده لكلّ طلب (ولا خادمَ خلف هذه الصفحة)، والبصمةُ
        #     تتغيّر مع كلّ تعديل حرفٍ فتُنسى فتُشَلّ الصفحةُ بصمت.
        #
        # وما بقي مفتوحًا يُقال ولا يُخفى:
        #   • `'unsafe-eval'` **لا مفرّ منه**: مضيفُ الامتدادات يبني وحداتِ CommonJS
        #     بـ`new Function(...)` — هي آليّةُ تحميل الامتدادات نفسُها.
        #   • `'unsafe-inline'` في `style-src`: السماتُ وألوانُ الرموز وقياساتُ المحرِّر
        #     كلُّها `<style>` يُبنى وقتَ التشغيل. لا مخرجَ بلا رقعةِ نواة.
        # وكلاهما حدُّ المنصّة لا كسلُنا، والسياسةُ مع ذلك تُغلِق ما تُغلِقه:
        # `default-src 'none'` و`base-uri 'none'` و`form-action 'none'`
        # و`frame-ancestors 'none'` — فلا حقنُ قاعدةٍ ولا إرسالُ نموذجٍ ولا تأطير.
        # وسياسةُ **موقعٍ ثابت**، أضيقُ بكثيرٍ من سياسة الورشة: لا `unsafe-eval`
        # ولا `unsafe-inline` في السكربتات، ولا اتّصالَ خارجيًّا. وذلك مكسبُ فصلِ
        # الأصل: ما كان حدَّ منصّةٍ هناك ليس حدًّا هنا.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # ‏`=404` لا `/index.html`: لا توجيهَ مسارٍ في هذا البناء، وإرجاعُ الصفحة
        # مكانَ أصلٍ مفقودٍ يُنتج خطأَ نوعِ MIME بدل 404 صريح — عطبٌ يصعب تشخيصُه.
        try_files $uri $uri/ =404;
    }

    # ✅ `Content-Security-Policy` مُرسَلةٌ في كتلة `location /` أعلاه [CSP-01] —
    #    قِيست بـ`Report-Only` في إدج نظيف ثمّ أُغلِقت وأُعيد القياس. ولم تُرسَل في
    #    `/out/`: هناك مستندان يحملان سياستَيهما المنبعيّتَين، وتقاطُعُنا معهما يقتل
    #    مضيفَ الامتدادات بلا صفحةٍ بيضاء.
    # ⛔ ولا `Cross-Origin-Embedder-Policy` ولا `Cross-Origin-Opener-Policy`:
    #    يكسران الـwebviews (أُطُرٌ بحكم التصميم).
}

# ── محرابُ المتصفّح — أصلٌ مستقلّ ─────────────────────────────────────────────
# انتقل إلى هنا من جذر `mihrab.dev`. والنقلُ نقلُ **أصلٍ** لا إضافةُ اسم: ما خزّنه
# زائرٌ في IndexedDB — إعداداتُه وملفّاتُه غيرُ المعنونة و**مقابضُ المجلّدات** التي
# منحها عبر File System Access — مربوطٌ بالأصل ولا ينتقل معه. فمن استعمل المحرِّرَ
# على الجذر يُعيد منحَ الإذن لمجلّداته مرّةً واحدة. دُفِعت الكلفةُ عمدًا وفي أصغر
# قاعدةٍ ممكنة، **ولا يُنقَل الأصلُ بعد اليوم**.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ لا `http2` — nginx 1.24 لا يعرف التوجيه المستقلّ، وHTTP/2 مفعَّلٌ سلفًا على المقبس

    server_name app.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/mihrab-app.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab-app.error.log warn;

    root /opt/mihrab/static;
    index index.html;

    client_max_body_size 1m;
    limit_conn mihrab_conn 64;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    # ── صفحةُ الخطأ، مستعارةٌ من شجرة الموقع ──
    # جذرُ هذه الكتلة `/opt/mihrab/static` — حمولةُ الورشة، ولا `404.html` فيها
    # ولا ينبغي: هي مخرَجُ بناءِ المحرِّر، وإقحامُ صفحةٍ تسويقيّةٍ فيها يجعل كلَّ
    # نشرِ بناءٍ يمحوها. فيُشار إلى نسخةِ الموقع بـ`alias` — ملفٌّ واحدٌ على
    # القرص، يُحدَّث بنشر الموقع ويصل الأصلين.
    #
    # ولا `root` بديلًا: `root` كان سيجعل الطلبَ يقصد `/opt/mihrab/site/404.html`
    # وهو صحيحٌ هنا بالصدفة — و`alias` يقول ما نقصده: **هذا الملفُّ بعينه**.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        alias /opt/mihrab/site/404.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # ── و`https://mihrab.dev` في `script-src`/`style-src`/`font-src` هنا وحدَه ──
        # صفحةُ ‎404‎ **مشتركةٌ** بين الأصلين (`alias` أعلاه إلى نسخةِ الموقع)،
        # وأصولُها مكتوبةٌ بأصلها كاملًا (`https://mihrab.dev/assets/…`) لأنّ
        # المطلقَ من الجذر كان يقصد `/opt/mihrab/static/assets/` ولا وجودَ له.
        # و`'self'` هنا هو **app.mihrab.dev**، فبلا هذا التصريح تحجب السياسةُ
        # ورقتَي الأنماط والسكربتَ كليهما: الصفحةُ تصل بلا أيّ نمطٍ — وهي بعينها
        # العلّةُ التي أراد كتبُ الأصلِ كاملًا إزالتَها، منقولةً من طبقةِ المسار
        # إلى طبقةِ السياسة. (وهذا الموضِعُ `internal` ولا يخدم إلّا صفحةَ
        # الخطأ؛ سياسةُ الورشة في `location /` لا تُمسّ.)
        # ⚠️ وخطوطُ الويب لا يكفيها هذا: `@font-face` عابرُ أصلٍ **تحكمه CORS**
        # لا السياسةُ وحدَها. وقد وُرِّدت الأوجهُ الأربعةُ فأُضيفت الترويسةُ في
        # كتلة `location ^~ /assets/fonts/` بكتلة `mihrab.dev` أعلاه.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://mihrab.dev; style-src 'self' 'unsafe-inline' https://mihrab.dev; img-src 'self' data:; font-src 'self' data: https://mihrab.dev; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # ⛔ لا `immutable` ولا سنة — العلّةُ موثّقةٌ بالتفصيل في كتلة الجذر أعلاه
    #    [DEP-02]: المسارُ غيرُ مبصوم، وقائمةُ الامتدادات المضمَّنة مخبوزةٌ داخل
    #    الحزمة نفسِها، فحزمةٌ مخزَّنةٌ لا تعرف لغةً جديدةً إطلاقًا.
    location /out/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        # مكرَّرةٌ عمدًا: `add_header` في هذا المستوى يلغي وراثةَ ما فوقه.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ── ملاحظاتُ الإصدار: **من هذا الأصل لا من الجذر** ──
    # **وهذه هي الكتلةُ الأصل**: `releaseNotesBaseUrl` في الهويّة يقصد هذا المضيفَ.
    #
    # `releaseNotesEditor.ts` يعيش في `browser/` فيعمل في الويب بـ`fetch`، وكان
    # الطلبُ ذاتيَّ الأصل حين كان المحرِّرُ على الجذر. ونقلُ الأصل جعله عابرًا —
    # و`connect-src` أدناه لا تحمل `https://mihrab.dev`، فكانت السياسةُ تحجبه **قبل
    # أن يبلغ الشبكة**، و`Access-Control-Allow-Origin: *` على الجذر لا ينفع: ‏CSP
    # تسبق CORS. وثُقبُ `connect-src` كان سيُبطِل عزلَ الأصل الذي هو علّةُ الفصل
    # كلِّه، فانتقلت **القاعدةُ** إلى هذا المضيف بدلًا من أن تُفتَح السياسة.
    #
    # ونسخةُ المكتب تجلب من هنا كذلك: أصلُها `vscode-file://vscode-app` فطلبُها
    # عابرُ أصلٍ على كلّ حال، وترويسةُ CORS أدناه هي ما يُجيزه.
    #
    # والمجلّدُ واحدٌ لا نسختان: `alias` إلى `/opt/mihrab/notes/` عينِه الذي يخدمه
    # الجذر، فينشر `publish_release_notes.sh` مرّةً ويصل الأصلين.
    location /notes/ {
        alias /opt/mihrab/notes/;
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown text/plain text/css application/javascript;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        location ~ /\. { return 404; }
        try_files $uri =404;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cache-Control             "no-cache" always;

        # ── [CSP-01] سياسةُ الورشة، منقولةٌ كما هي ──
        # قِيست بـ`Report-Only` في إدج نظيف ثمّ أُغلِقت وأُعيد القياس: الورشةُ تُقلِع،
        # ومضيفُ الامتدادات حيّ، وصفرُ مخالفات. و`'unsafe-eval'` حدُّ منصّةٍ لا كسلٌ
        # (‏`new Function` هو آليّةُ تحميل الامتدادات)، و`'unsafe-inline'` في الأنماط
        # كذلك (السماتُ وألوانُ الرموز تُبنى وقتَ التشغيل).
        # ولا تُرسَل في `/out/`: هناك مستندان يحملان سياستَيهما المنبعيّتَين، وتقاطُعُنا
        # معهما يقتل مضيفَ الامتدادات بلا صفحةٍ بيضاء.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob: https://open-vsx.org https://openvsx.eclipsecontent.org https://raw.githubusercontent.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        try_files $uri $uri/ =404;
    }
}
