# محرابُ المتصفّح **الثابت** — كتلُ 443. لا خادمَ خلفها، ولا عمليّةَ تعمل.
#
# يحلّ محلَّ `mihrab.dev.conf` (الوسيطِ إلى `vscode-reh-web`). والفرقُ ليس تحسينًا:
# ذاك كان يفتح **نظامَ ملفّاتٍ وطرفيّةً** على الخادم خلف عنوانٍ عامّ، مهما أُحكِم
# رمزُ الاتّصال. وهذا ملفّاتٌ ثابتةٌ فقط — والملفّاتُ من جهاز الزائر عبر
# ‏File System Access. سطحُ الهجومِ الذي كان يُقلِق زال ولم يُقلَّل.
#
# ⚠️⚠️ **موضعُه `sites-enabled/mihrab` لا `conf.d/`.** ‏`nginx.conf` على هذا الخادم
# يُدرِج `conf.d/*.conf` **ثمّ** `sites-enabled/*`، ولا كتلةَ `default_server` على
# 443 في أيٍّ منها (قِيس). فالخادمُ الافتراضيُّ أوّلُ كتلةٍ بترتيب التحليل — وهي
# اليومَ `kadah`. ووضعُ هذا في `conf.d/` يجعله يسبقها فيصير محرابٌ الافتراضيَّ
# لكلّ `Host` مجهول. و«mihrab» يلي «kadah» أبجديًّا فالترتيبُ سليم.
#
# ولم يعد يعتمد على `00-mihrab-shared.conf` إلّا في `limit_conn_zone`: لا وسيطَ
# ⇒ لا `upstream` ولا `map $http_upgrade`. يبقى الملفُّ حيث هو بلا ضرر.

# ── www ⇒ الجذر: عنوانٌ واحدٌ للمشروع لا اثنان ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ **لا `http2` بأيّ صيغة.** قِيس: nginx 1.24.0 هنا، والتوجيهُ المستقلُّ
    #    `http2 on;` وُلد في 1.25.1 ⇒ «unknown directive» فيسقط الملفُّ ولا يقلع
    #    nginx. والصيغةُ القديمة لا تلزم: `kadah` تضع `listen 443 ssl http2;`
    #    وخيارُ المقبس يسري على المقبس كلِّه ⇒ HTTP/2 مفعَّلٌ سلفًا (قِيس: %{http_version}=2).
    server_name www.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://mihrab.dev$request_uri;
}

# ── محراب ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;

    # بلا هذا الإدراج تسقط الكتلةُ إلى افتراضيّاتِ nginx — وقد تشمل TLSv1/1.1.
    # كتلةُ `sad-lang.org` تُدرِج القصاصةَ على مستواها هي، ولا تُورَث.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # ⛔ **لا `ssl_session_*` هنا.** القصاصةُ أعلاه تضع الثلاثةَ (قِيست)، وnginx يرفض
    #    التكرارَ بـ«directive is duplicate» فلا يقلع. أُوقِع فعلًا وأنقذته البوّابةُ
    #    التلقائيّة. و`ssl_dhparam` يبقى: القصاصةُ لا تضعه (قِيس: صفرُ ذكر).
    # ⛔ لا `ssl_stapling`: أنهت Let's Encrypt خدمةَ OCSP وأزالت روابطَ المستجيب (2025).

    server_tokens off;
    access_log /var/log/nginx/mihrab.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab.error.log warn;

    root /opt/mihrab/static;
    index index.html;

    # لا رفعَ إلى هذا الموقع أصلًا — لا خادمَ يستقبل. السقفُ الصغيرُ يمنع طلبًا
    # ضخمًا من إشغال القرص الذي يخدم `sad-lang.org` كذلك.
    client_max_body_size 1m;
    limit_conn mihrab_conn 64;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json
               # ملاحظاتُ الإصدار عربيّةٌ كلُّها — بايتان لكلّ محرف، فالضغطُ عليها أعلى ممّا
               # يبدو من حجمها. وبلا هذا السطر تُخدَم خامًّا في كلّ فتحةِ ملاحظات.
               text/markdown;

    # ⛔ **لا كتلةَ `types` هنا.** كانت هنا واحدةٌ تضيف `wasm`/`woff2` — وهذا خطأٌ
    #    في فهم التوجيه: `types` على مستوى `server` **يستبدل** الجدولَ الموروث ولا
    #    يوسّعه. فصار كلُّ ما عداها `application/octet-stream`: الصفحةُ نفسُها،
    #    و`boot.js`، والورقة. ومع `nosniff` يرفض المتصفّحُ تنفيذَ الوحدات ⇒ موقعٌ
    #    أبيضُ بلا رسالةِ خطأ. أُوقِع حيًّا وقِيس بـ`curl -I`.
    #    و`/etc/nginx/mime.types` على هذا الخادم يغطّي الاثنين سلفًا (قِيس:
    #    `application/wasm wasm` سطر 55 · `font/woff2 woff2` سطر 29)، فلا حاجةَ أصلًا.

    # ── طبقةُ العزل: روابطُ المنتَج تشير إلى نطاقِنا لا إلى GitHub خامًا ──
    # علّتُها أنّ هذه الروابط تُطبَع في ثنائيّاتٍ موقَّعةٍ وإصداراتٍ ماضيةٍ لا تُستردّ.
    location = /issues     { return 301 https://github.com/sadlang/mihrab/issues; }
    location = /issues/new { return 301 https://github.com/sadlang/mihrab/issues/new; }
    location = /license    { return 301 https://github.com/sadlang/mihrab/blob/main/LICENSE; }
    location = /releases   { return 301 https://github.com/sadlang/mihrab/releases; }
    location = /repo       { return 301 https://github.com/sadlang/mihrab; }

    # ── ⛔ لا `immutable` هنا، ولا سنة ──
    # كان: `max-age=31536000, immutable` بحجّة «المحتوى مبصومٌ بالبناء». **وهو ليس
    # مبصومًا**: `index.html` يصل `out/nls.messages.js` و`workbench.web.main.internal.css`
    # بأسماءَ ثابتةٍ لا تتغيّر بين البناءات (وبوّابةُ `static_deploy.sh` تفحص المسارات
    # نفسَها حرفيًّا عبر البناءات — لو كانت مبصومةً لَما صحّ ذلك).
    #
    # والأثرُ ليس بطئًا بل **كسرٌ مؤجَّل**: زائرٌ خزّن `/out/*` سنةً، ثمّ نُشِر بناءٌ
    # جديد. صفحتُه تُجدَّد (`no-cache`) وحزمتُه **لا تُطلَب أصلًا** — و`immutable`
    # تُلغي إعادةَ التحقّق حتّى مع `Ctrl+R`. صفحةُ إقلاعٍ جديدةٌ فوق حزمةٍ قديمة،
    # وإصلاحٌ أمنيٌّ لا يبلغ زائرًا عائدًا إلى سنةٍ من الآن.
    #
    # وكانت هنا عشرُ دقائقَ ومراجعةٌ بعدها. **أسقطتها نافذةُ العمى**، ولم تُسقِطها
    # نظريّة: نُشِرت `sad-lang` فلم تُلوِّن عند المُبلِّغ. والعلّةُ أنّ قائمةَ الامتدادات
    # المضمَّنة **مخبوزةٌ داخل الحزمة نفسِها** (`builtinExtensionsScannerService.ts:56`:
    # `bundledExtensions = [/*BUILD->INSERT_BUILTIN_EXTENSIONS*/]`) — فحزمةٌ مخزَّنةٌ
    # عمرُها دقائقُ لا تعرف اللغةَ الجديدة **إطلاقًا**، لا أنّها تعرفها بلا قواعد.
    # وأيُّ طزاجةٍ موجبةٍ تُنتج النافذةَ نفسَها، أقصرَ لا غير.
    #
    # والثمنُ **مقيسٌ لا مقدَّر**: إقلاعٌ باردٌ حقيقيٌّ من `mihrab.access.log` =
    # ‏١٠ طلبات `/out/` (زائرٌ خارجيّ: ‎21‎ طلبًا · ‎5.54‎ م.ب). فالعائدُ يدفع عشرَ
    # مراجعاتٍ مشروطة، وقِيست على هذا الخادم: **304 بصفرِ بايت** لبصمةٍ ضعيفةٍ
    # وقويّةٍ، بضغطٍ وبلا ضغط، ولـ`If-Modified-Since` كذلك.
    #
    # ⚠️ ولا تُكتَب `max-age=0, must-revalidate` مكانَها: صياغتان لعقدٍ واحدٍ في ملفٍّ
    #    واحدٍ تفترقان بصمت. والحارسُ يقيس **العقدَ** — عمرَ الطزاجة صفرًا — لا الكلمة،
    #    فأيُّ الصياغتَين كُتِبت مرّت.
    #
    # ⛔ **ولا يُبصَم المسار** (‏`/out-<hash>/`) — دُرِس وسقط، والدَّينُ يُغلَق لا يُؤجَّل:
    #    `network.ts:271-272` يحلّ `builtinExtensionsPath = 'vs/../../extensions'`
    #    بالصعود مستويَين من جذر الملفّات، فبصمُ `/out/` يُخرِج `/extensions/`
    #    و`/node_modules/` من البصمة بحكم الحساب — أي يبصم الشجرةَ التي لم تُعطِبنا
    #    ويترك التي فيها قواعدُ التلوين و`onig.wasm`. ويُنتج فوقَ ذلك عمّالَ خدمةٍ
    #    يتيمة: `pre/index.html:256` يسجّل عاملًا نطاقُه داخل `/out/`، ولا أحدَ
    #    يستدعي `unregister()` على نطاقٍ زال — تسجيلٌ يبقى عن كلّ نشرٍ مضى.
    location /out/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        # مكرَّرةٌ عمدًا: `add_header` في هذا المستوى يلغي وراثةَ ما فوقه.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ملاحظاتُ الإصدار: نصٌّ خامٌّ يطلبه محرِّرُ الملاحظات داخل التطبيق
    # (‏`<releaseNotesBaseUrl>/v<كبير>_<صغير>.md` — انظر `product-overrides/product.json`).
    #
    # **`alias` إلى مجلّدٍ خارج جذر الحمولة عمدًا:** النشرُ الثابت يبدّل
    # `/opt/mihrab/static` كتلةً واحدةً ذرّيًّا، فملاحظاتٌ داخله تختفي مع أوّل نشرِ
    # بناءٍ لا يحملها — وعمرُ الملاحظات أطولُ من عمر الحمولة: تُنشَر مرّةً وتبقى
    # لكلّ بناءٍ من الإصدار نفسِه، ويقرؤها من لم يحدّث بعد.
    #
    # و`text/markdown` صراحةً: خرائطُ الأنواع لا تعرف `.md` فتُرسَل
    # `application/octet-stream`، و`nosniff` أعلاه يمنع التخمين — فيصير الملفُّ
    # تنزيلًا في المتصفّح بدل نصٍّ يُقرأ (يهمّ نسخةَ المتصفّح: `IRequestService`
    # فيها `fetch` لا طلبٌ من Node).
    location /notes/ {
        alias /opt/mihrab/notes/;
        default_type text/markdown;
        charset utf-8;
        # ‏`charset_types` **يستبدل** القائمةَ الافتراضيّة ولا يضيف إليها — العلّةُ نفسُها
        # الموثَّقةُ أعلاه عن `types`. فتُذكَر الأنواعُ الأخرى معه، وإلّا فقدَ أوّلُ ملفٍّ
        # غيرِ `.md` يوضَع هنا ترميزَه.
        charset_types text/markdown text/plain text/html text/css application/javascript;
        add_header Cache-Control "public, max-age=300" always;
        # **وهذه الترويسةُ هي الفرقُ بين ميزةٍ تعمل وميزةٍ لا تعمل.** طلبُ الملاحظات يجري
        # بـ`fetch` في عارضِ التطبيق، وأصلُه `vscode-file://vscode-app` — أي طلبٌ عابرُ أصلٍ
        # تحكمه CORS. قِيس حيًّا من داخل محراب: `code.visualstudio.com/raw` يُجيب ‎200‎
        # (يُرسِل الترويسةَ لهذا الأصل بعينه)، و`mihrab.dev` يسقط بـ`Failed to fetch`
        # **رغم أنّه يردّ ‎200‎ لـcurl**. فمن تحقّق بـcurl وحدَه أعلن نجاحًا على خادمٍ مكسور.
        # و`*` مقبولةٌ هنا: نصٌّ عامٌّ للقراءة، بلا كعكةٍ ولا اعتماد. ونسخةُ المتصفّح تقرؤه
        # من أصله نفسِه فلا تحتاجها أصلًا.
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options    "nosniff" always;
        # مكرَّرةٌ عمدًا: `add_header` في هذا المستوى يلغي وراثةَ ما فوقه.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # ملفُّ رفعٍ منقطعٍ يبقى باسمٍ مخفيّ (`.v1_126.md.part`) — وnginx يخدم المخفيَّ
        # افتراضًا. لا يُخمَّن الاسمُ عادةً، لكنّ نصفَ مستندٍ يُقدَّم لقارئٍ خطأٌ لا مبرّرَ له.
        location ~ /\. { return 404; }
        try_files $uri =404;
    }

    location / {
        # ⚠️ **مكرَّرةٌ هنا عمدًا.** `add_header` يُورَث من الأعلى فقط إن لم يوجد أيُّ
        # `add_header` في المستوى الحاليّ — فالتصريحُ هنا يمنع تبخّرَها يومَ يضيف
        # أحدُهم ترويسةً واحدةً في هذه الكتلة.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # صفحةُ المضيف وإعدادُ المنتَج يتغيّران مع كلّ نشرٍ تحت الاسم نفسِه ⇒ لا تُخزَّن.
        add_header Cache-Control             "no-cache" always;

        # ── [CSP-01] سياسةُ أمان المحتوى ────────────────────────────────────
        # **قِيست ولم تُخمَّن.** أُرسلت أوّلًا `Report-Only` على الشجرة المبنيّة في
        # إدج نظيف، وجُمِعت مخالفاتُها عبر CDP، ثمّ أُغلِقت وأُعيد القياس: الورشةُ
        # تُقلِع، ومضيفُ الامتدادات حيٌّ (أوامرُ «محراب:» و«ص:» في لوحة الأوامر)،
        # وصفرُ طلباتٍ فاشلة، وصفرُ مخالفات.
        #
        # وثلاثةُ دروسٍ من القياس، كلٌّ منها كان سيكسر الموقعَ لو خُمِّن:
        #
        # ‏(١) **الترويسةُ هنا لا في `/out/`.** تحت `/out/` مستندان يحملان سياستَيهما
        #     المنبعيّتَين — إطارُ مضيف الامتدادات وصفحةُ الـwebview — وكلاهما يشغّل
        #     سكربتًا داخليًّا بحكم تصميمه. وسياستُنا تتقاطع معهما لا تحلّ محلَّهما،
        #     فإرسالُها هناك يقتل مضيفَ الامتدادات: الورشةُ تُقلِع، والسمةُ تُرسَم،
        #     ولا امتدادَ يعمل — عطبٌ **بلا صفحةٍ بيضاء**. وبقيّةُ `/out/` أصولٌ لا
        #     مستندات، ولا تُطبَّق عليها سياسةٌ أصلًا.
        #
        # ‏(٢) **`openvsx.eclipsecontent.org`** شبكةُ توصيل Open VSX. لم تكن في أوّل
        #     صياغةٍ للسياسة، وكانت ستمنع تنزيلَ حزمة اللغة العربيّة صامتةً.
        #
        # ‏(٣) **لا `'unsafe-inline'` في `script-src`** — وثمنُ ذلك أنّ سكربتَ الإقلاع
        #     خرج من `index.html` إلى `boot-early.js` [WEB-09]. والبديلان مرفوضان:
        #     النونس يحتاج خادمًا يولّده لكلّ طلب (ولا خادمَ خلف هذه الصفحة)، والبصمةُ
        #     تتغيّر مع كلّ تعديل حرفٍ فتُنسى فتُشَلّ الصفحةُ بصمت.
        #
        # وما بقي مفتوحًا يُقال ولا يُخفى:
        #   • `'unsafe-eval'` **لا مفرّ منه**: مضيفُ الامتدادات يبني وحداتِ CommonJS
        #     بـ`new Function(...)` — هي آليّةُ تحميل الامتدادات نفسُها.
        #   • `'unsafe-inline'` في `style-src`: السماتُ وألوانُ الرموز وقياساتُ المحرِّر
        #     كلُّها `<style>` يُبنى وقتَ التشغيل. لا مخرجَ بلا رقعةِ نواة.
        # وكلاهما حدُّ المنصّة لا كسلُنا، والسياسةُ مع ذلك تُغلِق ما تُغلِقه:
        # `default-src 'none'` و`base-uri 'none'` و`form-action 'none'`
        # و`frame-ancestors 'none'` — فلا حقنُ قاعدةٍ ولا إرسالُ نموذجٍ ولا تأطير.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob: https://open-vsx.org https://openvsx.eclipsecontent.org https://raw.githubusercontent.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # ‏`=404` لا `/index.html`: لا توجيهَ مسارٍ في هذا البناء، وإرجاعُ الصفحة
        # مكانَ أصلٍ مفقودٍ يُنتج خطأَ نوعِ MIME بدل 404 صريح — عطبٌ يصعب تشخيصُه.
        try_files $uri $uri/ =404;
    }

    # ✅ `Content-Security-Policy` مُرسَلةٌ في كتلة `location /` أعلاه [CSP-01] —
    #    قِيست بـ`Report-Only` في إدج نظيف ثمّ أُغلِقت وأُعيد القياس. ولم تُرسَل في
    #    `/out/`: هناك مستندان يحملان سياستَيهما المنبعيّتَين، وتقاطُعُنا معهما يقتل
    #    مضيفَ الامتدادات بلا صفحةٍ بيضاء.
    # ⛔ ولا `Cross-Origin-Embedder-Policy` ولا `Cross-Origin-Opener-Policy`:
    #    يكسران الـwebviews (أُطُرٌ بحكم التصميم).
}
