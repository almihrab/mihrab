# مشتركاتُ محراب — تُوضَع في `/etc/nginx/conf.d/` وتُحمَّل **قبل** كتل الخدمة.
#
# البادئةُ `00-` ليست زينة: `conf.d/*.conf` تُحمَّل أبجديًّا، و`$connection_upgrade`
# متغيّرٌ يجب أن يُعرَّف قبل استعماله. وكان تعريفُه في **تعليقٍ** داخل ملفّ الموقع —
# فلو نُقل الملفُّ وحدَه لفشل `nginx -t` بـ«unknown variable»، ولَما أقلع nginx بعد
# أوّلِ `restart`، فسقط `sad-lang.org` والموقعُ الافتراضيُّ معه. إصلاحٌ حَرِجٌ في
# تعليقٍ ليس توثيقًا.
#
# ⚠️ تحقّق أوّلًا ألّا تكون الخريطةُ معرَّفةً سلفًا (التعريفُ مرّتين خطأُ تحميل):
#     nginx -T | grep -n 'connection_upgrade'

# ترقيةُ WebSocket. **`''` لا `close`**: القيمةُ `close` تُرسِل `Connection: close`
# مع كلِّ طلبٍ عاديّ، وسطحُ مكتبِ VS Code يطلب مئاتِ الأصولِ عند التحميل البارد —
# أي مئةُ مصافحةِ TCP نحو Node بدل اتّصالٍ مُعادِ الاستعمال.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# حدُّ اتّصالاتٍ يمنع استنزافَ مقابس Node. **ولا `limit_req` على `/`**: سطحُ المكتب
# يطلق عشراتِ الطلباتِ المتزامنة عند التحميل، فيعطي حدُّ المعدّل 503 عشوائيّةً
# تُقرَأ «عطبًا في المحرِّر». ورمزُ الاتّصال 256 بتّة لا يُخمَّن، فلا حاجةَ لحمايةِ استيثاق.
limit_conn_zone $binary_remote_addr zone=mihrab_conn:10m;

upstream mihrab_web {
    server 127.0.0.1:14006;
    keepalive 32;
}
