# المرحلةُ الأولى وحدَها: المنفذ 80 — تحدّي ACME وتحويلٌ إلى HTTPS.
#
# **لماذا ملفٌّ منفصل:** ‏nginx يقرأ الشهادةَ **عند التحميل**، فكتلةُ 443 تشير إلى
# `.pem` غيرِ موجودٍ تمنع nginx من الإقلاع أصلًا — ومنه تمنع خدمةَ المنفذِ 80 التي
# يحتاجها certbot ليصنع تلك الشهادة. دورةٌ مغلقة. فتُوضَع هذه وحدَها أوّلًا،
# وتُصدَر الشهادة، ثمّ تُوضَع كتلُ 443.
#
# **قِيس على الخادم**: `sad-lang.org` يجدّد بمُصادِقِ `nginx` لا بـwebroot
# (‏`authenticator = nginx` · `installer = nginx`). فاستعمل الطريقةَ نفسَها:
#
#     sudo certbot certonly --nginx -d mihrab.dev -d www.mihrab.dev
#
# ومُصادِقُ nginx يعدّل كتلةَ الموقع مؤقّتًا ويعيدها، فيكفيه وجودُ هذه الكتلة —
# ولا يحتاج `/var/www/certbot` أصلًا. أُبقيت كتلةُ `acme-challenge` أدناه لأنّها
# لا تضرّ وتنفع إن انتقلتَ يومًا إلى webroot.

server {
    listen 80;
    listen [::]:80;
    # ── الأسماءُ الخمسةُ هنا، والشرطُ الذي أدخل الثلاثةَ الأخيرة ──
    # كان `docs` و`dl` **مُخرَجَين عمدًا**، والتعليلُ كما كُتب: سجلّاهما منشوران في
    # DNS ولا كتلةَ 443 لهما ولا اسمَهما في الشهادة، فإعلانُهما على 80 وحدَه يُسقِط
    # `https://docs.mihrab.dev` إلى الكتلة الافتراضيّة بشهادةٍ لا تحمل الاسم. و`.dev`
    # كلُّه في قائمة HSTS المحمَّلة ⇒ **لا زرَّ تجاوز**، والتحويلُ من 80 لا يُقرأ لأنّ
    # المتصفّحَ لا يطرق 80 أصلًا. أي حجبٌ تامٌّ لا صفحةٌ بديلة.
    #
    # وذلك المنعُ صحيحٌ **ما دامت الأسماءُ تبقى بلا شهادةٍ إلى أجلٍ غيرِ مسمّى** — وهو
    # ما كان. وشرطُه انتفى: الأسماءُ الثلاثةُ تُضاف الآنَ ومعها اسمُها في الشهادة
    # (`certbot --expand`) وكتلتُها في `mihrab.dev.subdomains.conf`، في جلسةٍ واحدة.
    # فالفجوةُ دقائقُ التحدّي لا شهورُ الإهمال.
    #
    # ⛔ **ومن أضاف اسمًا هنا فعليه أن يُتِمّ الثلاثةَ في الجلسة نفسِها**: اسمٌ على 80
    #    بلا شهادةٍ على 443 أسوأُ من اسمٍ لا يُعلَن أصلًا — و[SUB-01] يحرس الطرفَ
    #    الآخر (كلُّ اسمٍ في DNS تملكه كتلة) ولا يرى هذا الملفَّ وحدَه.
    #
    # و`app` معها: سجلُّه انتُشر في ‎2026-09-20‎، وكتلتُه تحويلٌ مؤقّتٌ ‎302‎ حتّى ينتقل
    # إليه محرابُ المتصفّح.
    server_name mihrab.dev www.mihrab.dev app.mihrab.dev docs.mihrab.dev dl.mihrab.dev;

    # موضعُه: sites-enabled/mihrab-acme (انظر تحذيرَ الموضع في mihrab.dev.conf)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ‏`.dev` كاملُه في قائمة HSTS المحمَّلة، فالمتصفّحُ لا يطرق 80 أصلًا. يبقى هذا
    # لعملاءَ لا يعرفون القائمة: curl · سكربتات · روبوتات.
    location / {
        return 301 https://mihrab.dev$request_uri;
    }
}
