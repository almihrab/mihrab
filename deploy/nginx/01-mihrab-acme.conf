# المرحلةُ الأولى وحدَها: المنفذ 80 — تحدّي ACME وتحويلٌ إلى HTTPS.
#
# **لماذا ملفٌّ منفصل:** ‏nginx يقرأ الشهادةَ **عند التحميل**، فكتلةُ 443 تشير إلى
# `.pem` غيرِ موجودٍ تمنع nginx من الإقلاع أصلًا — ومنه تمنع خدمةَ المنفذِ 80 التي
# يحتاجها certbot ليصنع تلك الشهادة. دورةٌ مغلقة. فتُوضَع هذه وحدَها أوّلًا،
# وتُصدَر الشهادة، ثمّ تُوضَع كتلُ 443.
#
# **ومُصادِقُنا `webroot` لا `nginx` — والسببُ مقيسٌ لا مُفضَّل.**
# كُتب هنا أوّلًا أنّ `sad-lang.org` يجدّد بمُصادِقِ `nginx`، فاستُعملت الطريقةُ نفسُها.
# ثمّ سقطت عند أوّل توسيعٍ حقيقيّ:
#
#     certbot certonly --nginx --cert-name mihrab.dev --expand -d …
#     → UnicodeDecodeError: 'utf-8' codec can't decode byte 0xd8 in position 0
#
# و‎0xD8‎ أوّلُ بايتٍ في الحرف العربيّ UTF-8: مُحلِّلُ إضافةِ nginx يقطع نصًّا عربيًّا في
# منتصف حرفٍ ثمّ يفكّ الشظيّة. وإعدادُنا سليم (‏`LANG=en_US.UTF-8`، ولا ملفَّ يبدأ
# ببايتٍ غيرِ ASCII) — لكنّ تعليقاتِنا عربيّةٌ كلُّها، فالعطبُ يلازمنا ولا يلازم غيرَنا.
#
# و`webroot` **لا يقرأ إعدادَ nginx ولا يكتبه**، فلا يبلغه العطب:
#
#     sudo mkdir -p /var/www/certbot
#     sudo certbot certonly --webroot -w /var/www/certbot --cert-name mihrab.dev --expand \
#          -d mihrab.dev -d www.mihrab.dev -d app.mihrab.dev -d docs.mihrab.dev -d dl.mihrab.dev
#
# فكتلةُ `acme-challenge` أدناه ليست احتياطًا بل **الطريقَ نفسَه**. و`--cert-name`
# لازمة: بدونها قد يُنشئ certbot سلالةً `mihrab.dev-0001` فتبقى كتلُنا تشير إلى
# `live/mihrab.dev/` القديمة — شهادةٌ صدرت والموقعُ لا يراها، وهو إخفاقٌ صامت.
#
# ⛔ ولا `certbot --nginx` المجرَّد بأيّ حال: هو **مُثبِّتٌ** كذلك، يُعيد كتابةَ كتل
#    الخادم ليحقن مسارات الشهادة — وكتلُنا تحملها مع تعليلاتها، والتكرارُ يُفشِل
#    الإقلاعَ بـ«directive is duplicate».

server {
    listen 80;
    listen [::]:80;
    # ── الأسماءُ الخمسةُ هنا، والشرطُ الذي أدخل الثلاثةَ الأخيرة ──
    # كان `docs` و`dl` **مُخرَجَين عمدًا**، والتعليلُ كما كُتب: سجلّاهما منشوران في
    # DNS ولا كتلةَ 443 لهما ولا اسمَهما في الشهادة، فإعلانُهما على 80 وحدَه يُسقِط
    # `https://docs.mihrab.dev` إلى الكتلة الافتراضيّة بشهادةٍ لا تحمل الاسم. و`.dev`
    # كلُّه في قائمة HSTS المحمَّلة ⇒ **لا زرَّ تجاوز**، والتحويلُ من 80 لا يُقرأ لأنّ
    # المتصفّحَ لا يطرق 80 أصلًا. أي حجبٌ تامٌّ لا صفحةٌ بديلة.
    #
    # وذلك المنعُ صحيحٌ **ما دامت الأسماءُ تبقى بلا شهادةٍ إلى أجلٍ غيرِ مسمّى** — وهو
    # ما كان. وشرطُه انتفى: الأسماءُ الثلاثةُ تُضاف الآنَ ومعها اسمُها في الشهادة
    # (`certbot --expand`) وكتلتُها في `mihrab.dev.subdomains.conf`، في جلسةٍ واحدة.
    # فالفجوةُ دقائقُ التحدّي لا شهورُ الإهمال.
    #
    # ⛔ **ومن أضاف اسمًا هنا فعليه أن يُتِمّ الثلاثةَ في الجلسة نفسِها**: اسمٌ على 80
    #    بلا شهادةٍ على 443 أسوأُ من اسمٍ لا يُعلَن أصلًا — و[SUB-01] يحرس الطرفَ
    #    الآخر (كلُّ اسمٍ في DNS تملكه كتلة) ولا يرى هذا الملفَّ وحدَه.
    #
    # و`app` معها: سجلُّه انتُشر في ‎2026-09-20‎، وكتلتُه تحويلٌ مؤقّتٌ ‎302‎ حتّى ينتقل
    # إليه محرابُ المتصفّح.
    server_name mihrab.dev www.mihrab.dev app.mihrab.dev docs.mihrab.dev dl.mihrab.dev;

    # موضعُه: sites-enabled/mihrab-acme (انظر تحذيرَ الموضع في mihrab.dev.conf)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ‏`.dev` كاملُه في قائمة HSTS المحمَّلة، فالمتصفّحُ لا يطرق 80 أصلًا. يبقى هذا
    # لعملاءَ لا يعرفون القائمة: curl · سكربتات · روبوتات.
    #
    # ⚠️ **`$host` لا `mihrab.dev` مكتوبًا.** كان المضيفُ حرفيًّا يومَ كان `server_name`
    #    اسمَين، وقفزةُ `www`←الجذر مقصودة. ثمّ أُضيفت `app` و`docs` و`dl` إلى
    #    `server_name` ولم يُمَسّ هذا السطر — فورثت الثلاثةُ تحويلًا إلى **مضيفٍ غيرِ
    #    مضيفِها**: `http://dl.mihrab.dev/x` ينتهي إلى `https://mihrab.dev/x` فـ404،
    #    ولا يمرّ بكتلة `dl` أصلًا. وهم بالضبط من كُتبت هذه الكتلةُ لهم: من لا يعرف
    #    قائمةَ HSTS فيطرق 80. قِيس حيًّا على الأسماء الثلاثة.
    #
    #    و`www` لا يخسر شيئًا: له كتلةُ ‎443‎ تقفز إلى الجذر، فالقفزةُ قفزتان لا واحدة.
    location / {
        return 301 https://$host$request_uri;
    }
}
