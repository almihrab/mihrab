# نطاقاتُ محرابٍ الفرعيّةُ التي تُحَلّ ولا تُخدَم — `docs` و`dl`.
#
# ## العطبُ الذي يُصلحه هذا الملفّ، مقيسًا لا مستنتَجًا
#
# ‏`docs.mihrab.dev` و`dl.mihrab.dev` لهما سجلّا A منذ ‎2026-09-05‎ (‏انظر الكتلةَ
# المقيسةَ في `deploy/README.md`)، **ولا كتلةَ `server` تطابقهما** في أيّ ملفّ.
# ونتيجةُ ذلك قِيست حيًّا:
#
#     docs.mihrab.dev → 200 · <title>قدح | Kadah - سيرفر ماينكرافت</title>
#     dl.mihrab.dev   → 200 · الشهادة: CN=192.168.33.20 (موقّعةٌ ذاتيًّا)
#
# أي أنّ زائرَ اسمِنا يرى تحذيرَ شهادةٍ ثمّ موقعَ شخصٍ آخر. والآليّةُ موثَّقةٌ سلفًا في
# رأس `mihrab.dev.static.conf`: لا `default_server` على ‎443‎ في أيّ ملفّ على هذا
# الخادم، فالافتراضيُّ **أوّلُ كتلةٍ بترتيب التحليل** — وهي `kadah`.
#
# ## ولماذا لا يُحَلّ بـ`default_server`
#
# كتلةُ `listen 443 ssl default_server` تُصلِح هذين الاسمَين **وتغيّر سلوكَ الخادم
# كلِّه**: ستّةُ مواقعَ تتشارك هذا الـnginx، وكلُّ `Host` مجهولٍ يقصد أيًّا منها يصير
# ‏444 بدل ما يصل إليه اليوم. ذلك قرارُ مالكِ الخادم لا قرارُ محراب، وهذا الملفُّ
# يحلّ مشكلةَ محرابٍ بأسماء محرابٍ وحدَها.
#
# ## ⚠️⚠️ لا يُركَّب قبل الشهادة
#
# تركيبُ كتلةٍ تشير إلى شهادةٍ غيرِ موجودة **يمنع nginx من الإقلاع فيُسقِط المواقعَ
# الستّةَ معًا** — وهو سببُ إفرادِ `webview.mihrab.dev.conf` بملفٍّ كذلك. والشهادةُ
# الحيّةُ اليومَ تحمل `mihrab.dev` و`www.mihrab.dev` فقط (قِيست بـ`openssl s_client`).
#
# والشهادةُ تُوسَّع بأسمائها صراحةً — **لا ببدلٍ عامّ**:
#
#     certbot certonly --webroot -w /var/www/certbot --cert-name mihrab.dev --expand \
#              -d mihrab.dev -d www.mihrab.dev -d app.mihrab.dev -d docs.mihrab.dev -d dl.mihrab.dev
#
#     (‏`--webroot` لا `--nginx`: مُحلِّلُ إضافةِ nginx يسقط بـ‏UnicodeDecodeError على
#      تعليقاتِنا العربيّة. التفصيلُ في رأس `01-mihrab-acme.conf`.)
#
# ⛔ **ولا بدلٌ على `mihrab.dev` نفسِه** — أي نجمةٌ مكانَ التسمية الفرعيّة. وهو أقصرُ
#    وأغرى، ويحرسه [DEP-01] فيحمرّ البناءُ على مجرّد ذكرِه في هذا المجلّد (ولذلك
#    يُوصَف هنا ولا يُكتَب). والعلّةُ أنّ شهادةً كتلك مفتاحٌ واحدٌ ينتحل **الموقعَ نفسَه**
#    لو تسرّب، لا أصولَ الإطارات وحدَها.
#
#    والبدلُ الوحيدُ المسموح هو بدلُ طبقة الـwebview — لأنّ أسماءَه تُولَّد وقتَ التشغيل
#    فلا تُسجَّل مسبقًا — **وفي شهادةٍ مستقلّةٍ لا تجمع معها اسمًا آخر**. وذلك ما يقيسه
#    الحارسُ في أمرِ certbot كلِّه لا في وسيطٍ واحد: نجمةٌ ضيّقةٌ مع `mihrab.dev` في
#    الأمر نفسِه تُنتج المفتاحَ الشاملَ عينَه وهي تبدو محترمةً للاحتواء.
#
# فثمنُ هذا الاحتواءِ سطرُ `--expand` مع كلّ اسمٍ جديد. وهو الثمنُ المقصود.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ لا `http2` — nginx 1.24 لا يعرف التوجيه المستقلّ، وHTTP/2 مفعَّلٌ سلفًا على المقبس

    server_name docs.mihrab.dev;

    # ⚠️ تحقّق من اسم السلالة كما ينشئها certbot — لا تفترضه: `certbot certificates`
    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    access_log /var/log/nginx/mihrab-subdomains.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab-subdomains.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── الوجهةُ هي مكانُ المحتوى اليومَ، لا مكانُه المرجوّ ──
    # التوثيقُ والثنائيّاتُ يُخدَمان الآنَ من `sad-lang.org/mihrab/`، و`build/deploy_site.sh`
    # يضعهما هناك. وتحويلٌ إلى صفحةٍ موجودةٍ على نطاقٍ سنغادره خيرٌ من تحويلٍ أنيقٍ إلى
    # ‏404 على نطاقنا. ويومَ يُخدَم الموقعُ من `mihrab.dev` يُقلَب السطران إلى
    # `https://mihrab.dev/docs/` و`https://mihrab.dev/dl/` — ومعهما `canonical` في
    # `site/data/site.json` ومفاتيحُ التوثيق في `product-overrides/product.json`.
    #
    # ── ‏302 لا 301، و`$request_uri` لا مسارٌ مقطوع ──
    # كُتب هذا أوّلًا `return 301 …/docs/;` بحجّة أنّ الاسمَ ينتقل نهائيًّا. وهو خطأٌ
    # مزدوجٌ نقضه سطرٌ في هذا الملفّ نفسِه:
    #
    # ‏(١) **الوجهةُ ليست نهائيّة.** مكتوبٌ أعلاه أنّ السطرَ «يُقلَب» إلى
    #     `https://mihrab.dev/docs/` يومَ يُخدَم الموقعُ من نطاقنا — أي أنّ هذه محطّةٌ
    #     مُعلَنٌ عن مغادرتها، لا دارٌ تُفهرَس. و‏301 يُخزِّنها متصفّحُ كلّ زائرٍ سابق،
    #     فيبقى يقفز إلى `sad-lang.org` **بعد** القلب بلا أن يسأل الخادم — شهرًا أو سنة.
    #     وهي بعينها الحجّةُ المكتوبةُ في كتلة `app` أدناه.
    #
    # ‏(٢) **المسارُ كان يسقط.** `return 301 …/docs/;` بلا `$request_uri` يبتلع ما بعد
    #     المضيف: `docs.mihrab.dev/settings/` ⇐ فهرسُ التوثيق لا صفحةُ الإعدادات. قِيس.
    #
    # ⛔ ولا `if ($host = ...)` في كتلةٍ واحدة: `if` داخل `location` سلوكُه مفاجئ،
    #    والمُقارَنةُ تكلّف طلبًا طلبًا ما يعرفه nginx سلفًا من `server_name`. كتلتان
    #    أطولُ سطرَين وأقصرُ تفسيرًا.
    return 302 https://sad-lang.org/mihrab/docs$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dl.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    access_log /var/log/nginx/mihrab-subdomains.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab-subdomains.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── كتلتان لأنّ `/mihrab/dl/` **مخزنُ ثنائيّاتٍ بلا فهرس** ──
    # `build/deploy_site.sh` يستثني `dl/` من بناء الموقع عمدًا (الثنائيّاتُ تُرفَع
    # ولا تُبنى)، فلا `index.html` فيه: `sad-lang.org/mihrab/dl/` يردّ ‎404‎ — قِيس.
    # فالجذرُ يقصد **صفحةَ التنزيل** (وهي `downloadUrl` في `product.json`)، وما تحته
    # يقصد الملفَّ نفسَه بمساره.
    #
    # وبلا `$request_uri` كان كلُّ رابطٍ عميقٍ إلى ثنائيٍّ ينهار إلى ذلك الجذر —
    # أي **كلُّ** استعمالٍ متصوَّرٍ لاسمٍ اسمُه `dl`. و‏302 للعلّة المشروحة في كتلة
    # `docs`: هذه محطّةٌ مُعلَنٌ عن مغادرتها.
    location = / {
        return 302 https://sad-lang.org/mihrab/download/;
    }

    location / {
        return 302 https://sad-lang.org/mihrab/dl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name app.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    access_log /var/log/nginx/mihrab-subdomains.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab-subdomains.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── ⚠️⚠️ ‏302 هنا، و301 في الكتلتين أعلاه. والفرقُ ليس تفصيلًا ──
    # `docs` و`dl` تنتقلان نهائيًّا، فـ301 صحيحةٌ ومطلوبة كي تتبعها الفهرسة.
    # أمّا `app` فاسمٌ **سنُعيد استعمالَه**: محرابُ المتصفّح ينتقل إليه من الجذر.
    # و301 تُخزَّن في متصفّح الزائر — فمن زاره اليومَ يبقى متصفّحُه يقفز إلى الجذر
    # **بعد** أن يصير هذا الاسمُ يخدم المحرِّرَ فعلًا، ولا يطلب الخادمَ ليكتشف
    # التغيير. تحويلٌ دائمٌ على اسمٍ مؤقّتٍ عطبٌ يُزرَع اليومَ ويظهر بعد شهور.
    return 302 https://mihrab.dev/;
}

# ── ولماذا `app` تحويلٌ مؤقّتٌ ولا تخدم المحرِّرَ بعد ──
# نقلُ محرابِ المتصفّح إلى هذا الاسم نقلُ **أصلٍ** لا إضافةُ اسم: ما خزّنه زائرٌ في
# IndexedDB — إعداداتُه وملفّاتُه غيرُ المعنونة و**مقابضُ المجلّدات** التي منحها عبر
# File System Access — مربوطٌ بالأصل ولا ينتقل معه. فالنقلُ يُيتِّمه ويُلزِم الزائرَ
# إعادةَ منحِ الإذن لمجلّداته. يُفعَل مرّةً واحدةً وفي أصغر قاعدةٍ ممكنة، بكتلةٍ تأخذ
# حمولةَ `/opt/mihrab/static` وسياستَها كما هي من `mihrab.dev.static.conf` — وعندها
# يصير الجذرُ للموقع التعريفيّ، وتُحذَف هذه الكتلةُ لا تُعدَّل.
#
# وفصلُ الأصلِ هو المقصود: الورشةُ تحتاج `script-src 'unsafe-eval'` (مضيفُ الامتدادات
# يبني الوحداتِ بـ`new Function`)، وصفحاتُ التعريف لا تحتاجها — والمسارُ تحت الجذر
# لا يفصل شيئًا، فالأصلُ مخطَّطٌ ومضيفٌ ومنفذ، لا مسار.
