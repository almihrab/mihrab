# نطاقاتُ محرابٍ الفرعيّةُ التي تُحَلّ ولا تُخدَم — `docs` و`dl`.
#
# ## العطبُ الذي يُصلحه هذا الملفّ، مقيسًا لا مستنتَجًا
#
# ‏`docs.mihrab.dev` و`dl.mihrab.dev` لهما سجلّا A منذ ‎2026-09-05‎ (‏انظر الكتلةَ
# المقيسةَ في `deploy/README.md`)، **ولا كتلةَ `server` تطابقهما** في أيّ ملفّ.
# ونتيجةُ ذلك قِيست حيًّا:
#
#     docs.mihrab.dev → 200 · <title>قدح | Kadah - سيرفر ماينكرافت</title>
#     dl.mihrab.dev   → 200 · الشهادة: CN=192.168.33.20 (موقّعةٌ ذاتيًّا)
#
# أي أنّ زائرَ اسمِنا يرى تحذيرَ شهادةٍ ثمّ موقعَ شخصٍ آخر. والآليّةُ موثَّقةٌ سلفًا في
# رأس `mihrab.dev.static.conf`: لا `default_server` على ‎443‎ في أيّ ملفّ على هذا
# الخادم، فالافتراضيُّ **أوّلُ كتلةٍ بترتيب التحليل** — وهي `kadah`.
#
# ## ولماذا لا يُحَلّ بـ`default_server`
#
# كتلةُ `listen 443 ssl default_server` تُصلِح هذين الاسمَين **وتغيّر سلوكَ الخادم
# كلِّه**: ستّةُ مواقعَ تتشارك هذا الـnginx، وكلُّ `Host` مجهولٍ يقصد أيًّا منها يصير
# ‏444 بدل ما يصل إليه اليوم. ذلك قرارُ مالكِ الخادم لا قرارُ محراب، وهذا الملفُّ
# يحلّ مشكلةَ محرابٍ بأسماء محرابٍ وحدَها.
#
# ## ⚠️⚠️ لا يُركَّب قبل الشهادة
#
# تركيبُ كتلةٍ تشير إلى شهادةٍ غيرِ موجودة **يمنع nginx من الإقلاع فيُسقِط المواقعَ
# الستّةَ معًا** — وهو سببُ إفرادِ `webview.mihrab.dev.conf` بملفٍّ كذلك. والشهادةُ
# الحيّةُ اليومَ تحمل `mihrab.dev` و`www.mihrab.dev` فقط (قِيست بـ`openssl s_client`).
#
# والشهادةُ تُوسَّع بأسمائها صراحةً — **لا ببدلٍ عامّ**:
#
#     certbot certonly --webroot -w /var/www/certbot --cert-name mihrab.dev --expand \
#              -d mihrab.dev -d www.mihrab.dev -d app.mihrab.dev -d docs.mihrab.dev -d dl.mihrab.dev
#
#     (‏`--webroot` لا `--nginx`: مُحلِّلُ إضافةِ nginx يسقط بـ‏UnicodeDecodeError على
#      تعليقاتِنا العربيّة. التفصيلُ في رأس `01-mihrab-acme.conf`.)
#
# ⛔ **ولا بدلٌ على `mihrab.dev` نفسِه** — أي نجمةٌ مكانَ التسمية الفرعيّة. وهو أقصرُ
#    وأغرى، ويحرسه [DEP-01] فيحمرّ البناءُ على مجرّد ذكرِه في هذا المجلّد (ولذلك
#    يُوصَف هنا ولا يُكتَب). والعلّةُ أنّ شهادةً كتلك مفتاحٌ واحدٌ ينتحل **الموقعَ نفسَه**
#    لو تسرّب، لا أصولَ الإطارات وحدَها.
#
#    والبدلُ الوحيدُ المسموح هو بدلُ طبقة الـwebview — لأنّ أسماءَه تُولَّد وقتَ التشغيل
#    فلا تُسجَّل مسبقًا — **وفي شهادةٍ مستقلّةٍ لا تجمع معها اسمًا آخر**. وذلك ما يقيسه
#    الحارسُ في أمرِ certbot كلِّه لا في وسيطٍ واحد: نجمةٌ ضيّقةٌ مع `mihrab.dev` في
#    الأمر نفسِه تُنتج المفتاحَ الشاملَ عينَه وهي تبدو محترمةً للاحتواء.
#
# فثمنُ هذا الاحتواءِ سطرُ `--expand` مع كلّ اسمٍ جديد. وهو الثمنُ المقصود.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ لا `http2` — nginx 1.24 لا يعرف التوجيه المستقلّ، وHTTP/2 مفعَّلٌ سلفًا على المقبس

    server_name docs.mihrab.dev;

    # ⚠️ تحقّق من اسم السلالة كما ينشئها certbot — لا تفترضه: `certbot certificates`
    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    access_log /var/log/nginx/mihrab-subdomains.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab-subdomains.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── ‏301 الآن، وكانت ‎302 ──
    # كانت الوجهةُ `sad-lang.org/mihrab/docs/` — محطّةً مُعلَنًا عن مغادرتها، فـ‎302‎
    # كانت الصواب: ‏301 يُخزِّنها متصفّحُ كلّ زائرٍ سابقٍ فيبقى يقفز إلى الوجهة القديمة
    # بعد التغيير بلا أن يسأل الخادم.
    #
    # وقد بلغت وجهتَها: التوثيقُ يُخدَم من `mihrab.dev/docs/` على نطاقنا. فلا انتقالَ
    # بعده، و‏301 تُوجِّه الفهرسةَ إلى الدار بدل أن تُبقي نسختين.
    #
    # و`$request_uri` يحفظ المسار: `docs.mihrab.dev/settings/` ⇐ صفحةُ الإعدادات لا
    # فهرسُ التوثيق. وبلا هذا كان كلُّ رابطٍ عميقٍ ينهار إلى الجذر — قِيس.
    return 301 https://mihrab.dev/docs$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dl.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    access_log /var/log/nginx/mihrab-subdomains.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab-subdomains.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── كتلتان لأنّ `/dl/` مخزنُ ثنائيّاتٍ بلا فهرس ──
    # `deploy_site.sh` يستثني `dl/` من بناء الموقع عمدًا (الثنائيّاتُ تُرفَع ولا
    # تُبنى)، فلا `index.html` فيه. فالجذرُ يقصد **صفحةَ التنزيل**، وما تحته يقصد
    # الملفَّ نفسَه بمساره.
    location = / {
        return 301 https://mihrab.dev/download/;
    }

    location / {
        return 301 https://mihrab.dev/dl$request_uri;
    }
}
