# أصلُ الـwebviews — **المرحلةُ الرابعة**، ملفٌّ منفصلٌ عمدًا.
#
# لا يُوضَع إلّا بعد صدور شهادةِ wildcard بـDNS-01. وضعُه قبلها يمنع nginx من
# الإقلاع (‏شهادةٌ مفقودة) فيُسقِط كلَّ المواقع — ولذلك لا يُدمَج مع كتل محراب.
#
# ## لماذا نطاقٌ فرعيٌّ بديلٌ لا مسارٌ تحت الجذر
#
# كلُّ webview يُحمَّل في `iframe` بأصلٍ عشوائيّ كي لا يبلغ أصلَ سطحِ المكتب. هذا
# عزلُ أمانِ VS Code نفسِه لا اختراعُنا؛ مسارٌ تحت الجذر يُلغيه.
#
# ## وما يُصلحه هذا الملفُّ فعلًا
#
# مقيسٌ في `product.json` — **للمكتبيّ والويب معًا**:
#   webviewContentExternalBaseUrlTemplate =
#     https://{{uuid}}.vscode-cdn.net/insider/ef65ac1…/out/…/webview/browser/pre/
# أي أنّ محتوى كلّ webview يأتي من شبكةِ مايكروسوفت، ومن إيداعِ insider ليس
# إيداعَنا — والملفّاتُ نفسُها مشحونةٌ عندنا. تبعيّةٌ بلا مقابل.
#
# ⚠️ ولا يُبدَّل ذلك المفتاحُ في `product-overrides/product.json` إلّا **بعد** أن
# يخدم هذا الملفُّ محتواه فعلًا: التبديلُ إلى عنوانٍ لا يخدم شيئًا يكسر الـwebviews
# في الشجرتين معًا.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ لا `http2` — nginx 1.24 لا يعرف التوجيه، وHTTP/2 مفعَّلٌ سلفًا على المقبس

    # اسمٌ وَصْفيٌّ لا نمطيّ: يطابق تسميةً واحدةً بالضبط — وهو ما يطابقه wildcard
    # الشهادةِ وسجلُّ الـDNS معًا. والتعبيرُ النمطيُّ كان يلتقط `$wv` ولا يستعمله،
    # فيكلّف مطابقةَ regex لكلِّ طلبٍ بلا مقابل.
    server_name *.webview.mihrab.dev;

    # ⚠️ تحقّق من اسم السلالة كما ينشئها certbot — لا تفترضه.
    #     certbot certificates
    ssl_certificate     /etc/letsencrypt/live/webview.mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webview.mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    access_log /var/log/nginx/mihrab-webview.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab-webview.error.log warn;

    # الالتقاطُ المسمّى `$rest` **إلزاميٌّ** مع `alias` داخل موقعٍ نمطيّ: لا يُلحَق
    # باقي الـURI تلقائيًّا كما يفعل مع البادئات.
    #
    # اجتيازُ المسار مسدود: nginx يفكّ ترميزَ `%2e%2e%2f` ثمّ يطبّع `../` **قبل**
    # مطابقةِ المواقع — شرطَ بقاء `merge_slashes on` (الافتراضيّ). لا تُطفئه.
    location ~ ^/[^/]+/[^/]+/out/vs/workbench/contrib/webview/browser/pre/(?<rest>.*)$ {
        alias /opt/mihrab/web/out/vs/workbench/contrib/webview/browser/pre/$rest;
        index index.html;                       # `$rest` فارغًا ⇒ مجلّد ⇒ 403 بدونه

        # ‏`*` لا يسمح بالاعتماديّات أصلًا (المواصفةُ تمنع الجمع)، وهذه ملفّاتٌ عامّةٌ
        # ثابتةٌ لا حالةَ مستخدمٍ فيها. والحاجةُ قائمة: الجلبُ من الإطار المعزول
        # عابرُ الأصل بحكم التصميم.
        add_header Access-Control-Allow-Origin "*" always;

        # أهمُّ موضعٍ لهذه الترويسة في النشر كلِّه: هنا تُخدَم **JavaScript** لأصلٍ معزول.
        add_header X-Content-Type-Options "nosniff" always;

        # المسارُ معنوَنٌ بالمحتوى (يحوي `{commit}`) ⇒ لا يتغيّر محتواه أبدًا.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / { return 404; }
}
