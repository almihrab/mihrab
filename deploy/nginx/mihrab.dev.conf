# محرابُ الويب — كتلُ 443. **المرحلةُ الثالثة**: لا تُوضَع قبل صدور الشهادة.
#
# ⚠️ **غيرُ مُجرَّبٍ على الخادم بعد.** مراجَعٌ هندسيًّا، ومصحَّحٌ بعد مراجعةٍ وجدت
# ثلاثةَ أعطابٍ كانت تُسقِط `sad-lang.org` لحظةَ التطبيق. ما قِيس مذكورٌ بوصفه
# قياسًا، وما لم يُقَس مذكورٌ بوصفه غيرَ مؤكَّد.
#
# يعتمد على [`00-mihrab-shared.conf`](00-mihrab-shared.conf) — يجب أن يُحمَّل قبله.
#
# ⚠️⚠️ **موضعُه `sites-enabled/mihrab` لا `conf.d/`.** هذا ليس ذوقًا: `nginx.conf`
# على هذا الخادم يُدرِج `conf.d/*.conf` **ثمّ** `sites-enabled/*`، ولا كتلةَ
# `default_server` على 443 في أيٍّ منها (قِيس). فالخادمُ الافتراضيُّ هو أوّلُ كتلةٍ
# بترتيب التحليل — وهي اليومَ `kadah`. ووضعُ هذا الملفِّ في `conf.d/` يجعله يسبقها
# **فيصير محرابٌ الافتراضيَّ**: كلُّ طلبٍ بترويسة Host مجهولةٍ يُمرَّر إلى محرِّرٍ
# يفتح طرفيّةً على الخادم. و«mihrab» يلي «kadah» أبجديًّا فالترتيبُ سليم.

# ── www ⇒ الجذر: عنوانٌ واحدٌ للمشروع لا اثنان ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ **لا تُضِف `http2` بأيّ صيغة.** قِيس على الخادم:
    #   • nginx 1.24.0 ⇒ التوجيهُ المستقلُّ `http2 on;` (وُلد في 1.25.1) يفشل
    #     بـ«unknown directive» فيسقط الملفُّ كلُّه ولا يقلع nginx.
    #   • والصيغةُ القديمة لا تلزم: كتلةُ `kadah` تضع `listen 443 ssl http2;`
    #     وخيارُ المقبس يسري على المقبس كلِّه ⇒ **HTTP/2 مفعَّلٌ سلفًا**
    #     (قِيس: `curl -o /dev/null -w %{http_version}` ⇒ 2). فلا شيءَ يُكسَب.
    server_name www.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://mihrab.dev$request_uri;
}

# ── محراب ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ⛔ لا `http2` — مفعَّلٌ سلفًا على المقبس (انظر الكتلةَ أعلاه)
    server_name mihrab.dev;

    # ⚠️ تحقّق من اسم السلالة: قد يكون `mihrab.dev-0001` إن تصادم الاسم.
    #     certbot certificates
    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;

    # بلا هذا الإدراج تسقط الكتلةُ إلى افتراضيّاتِ nginx — وقد تشمل TLSv1/1.1 في
    # الإصداراتِ الأقدم. كتلةُ `sad-lang.org` تُدرِج القصاصةَ على مستواها هي، ولا تُورَث.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_session_cache   shared:MihrabSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # ⛔ لا `ssl_stapling`: أنهت Let's Encrypt خدمةَ OCSP وأزالت روابطَ المستجيب من
    #    الشهادات (2025). تفعيلُه اليومَ يولّد تحذيرًا في السجلّ ولا يستنِد شيئًا.

    server_tokens off;
    access_log /var/log/nginx/mihrab.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/mihrab.error.log warn;

    # ‏**سقفٌ حقيقيٌّ لا صفر.** كان `0` معلَّلًا بحجم `workbench.js` (17 م.ب) — وهو
    # تعليلٌ خطأ: هذا الحدُّ للجسم **الصاعد** لا النازل. والعطبُ الفعليُّ أنّ
    # `proxy_request_buffering` مُفعَّلٌ افتراضيًّا، فمع `0` يكتب nginx جسمَ كلِّ طلبٍ
    # كاملًا إلى القرص **قبل** أن يراه الخادم — أي قبل التحقّق من رمز الاتّصال أصلًا.
    # طلبُ POST واحدٌ ضخمٌ يملأ قرصَ الخادم، والقرصُ نفسُه يخدم `sad-lang.org`.
    client_max_body_size 512m;
    client_body_timeout  60s;
    limit_conn mihrab_conn 64;

    # قيمةُ `gzip_proxied` الافتراضيّةُ `off` — أي أنّ nginx **لا يضغط ردودَ الوسيط**
    # ولو كان `gzip on` في `http{}`. وردودُ محرابِ الويب كلُّها ردودُ وسيط ⇒ 17 م.ب
    # بلا ضغطٍ في كلّ تحميلٍ بارد، فيُقرَأ البطءُ عطبًا.
    gzip            on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    # ⛔ ممنوعاتٌ مقصودة — لا تُضَف:
    #   Content-Security-Policy      ⇐ الخادمُ يرسلها بنفسه؛ `add_header` يضيف ولا
    #                                  يستبدل، فتصير ترويستان متعارضتان.
    #   Cross-Origin-Embedder-Policy ⇐ يكسر الـwebviews (أُطُرٌ عابرةُ الأصل بحكم التصميم)
    #   Cross-Origin-Opener-Policy   ⇐ كسابقه

    # ── طبقةُ العزل: روابطُ المنتَج تشير إلى نطاقِنا لا إلى GitHub خامًا ──
    # علّتُها أنّ هذه الروابط تُطبَع في ثنائيّاتٍ موقَّعةٍ وإصداراتٍ ماضيةٍ لا تُستردّ.
    # ⚠️ وتحجب هذه المساراتِ عن الخادم حجبًا مطلقًا. قِس قبل الاعتماد:
    #     for p in /issues /license /releases /repo; do
    #       curl -s -o /dev/null -w "$p %{http_code}\n" http://127.0.0.1:14007$p; done
    location = /issues     { return 301 https://github.com/mihrab-org/mihrab/issues; }
    location = /issues/new { return 301 https://github.com/mihrab-org/mihrab/issues/new; }
    location = /license    { return 301 https://github.com/mihrab-org/mihrab/blob/main/LICENSE; }
    location = /releases   { return 301 https://github.com/mihrab-org/mihrab/releases; }
    location = /repo       { return 301 https://github.com/mihrab-org/mihrab; }

    location / {
        # ⚠️ **مكرَّرةٌ هنا عمدًا.** `add_header` يُورَث من المستوى الأعلى فقط إن لم
        # يوجد أيُّ `add_header` في المستوى الحاليّ. فوضعُها هنا يجعل السلوكَ صريحًا
        # بدل أن يتبخّرَ يومَ يضيف أحدُهم ترويسةً واحدةً في هذه الكتلة.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        proxy_pass http://mihrab_web;
        proxy_http_version 1.1;

        # **أخطرُ سطرين في الملفّ.** مضيفُ الامتدادات يعمل على WebSocket؛ بدونهما
        # يُصيَّر سطحُ المكتب كاملًا ثمّ **يتجمّد بلا رسالةِ خطأ**.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # جلسةُ محرِّرٍ تبقى مفتوحةً ساعاتٍ بلا حركةٍ ظاهرة؛ المهلةُ الافتراضيّة (60ث)
        # تقطعها فيبدو الأمرُ «انقطاعًا عشوائيًّا».
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;

        # ‏keepalive على المقبس: مقبسٌ خاملٌ لساعاتٍ خلف NAT وسيطٍ يُقطَع من الوسيط
        # بلا إشعارٍ لأيّ طرف، فيبقى الطرفان ظانَّين أنّه حيّ — والمستخدمُ يرى
        # **تجمّدًا لا انقطاعًا**، وهو أسوأُ من رسالةِ خطأ.
        proxy_socket_keepalive on;

        proxy_buffering         off;   # لازمٌ لـ/fetch-callback (استطلاعٌ طويل)
        proxy_request_buffering off;   # مرِّر تدفّقًا، لا تخزّن على القرص
    }
}
