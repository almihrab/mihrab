# محراب على الويب — واجهةُ nginx
#
# ⚠️ **غيرُ مُجرَّبٍ على الخادم بعد.** كُتِب من قياسٍ محلّيٍّ لبناء 1.126.05942 (سلوكُ
# ‏server-main.js وترويساتُه وسياستُه) ومن حالةِ الخادم كما قِيست من الخارج (nginx يعمل،
# ‏Let's Encrypt عاملةٌ لـsad-lang.org). كلُّ سطرٍ هنا يحتاج تحقّقًا عند أوّل تطبيق.
#
# البنية: الخدمةُ مربوطةٌ بـ127.0.0.1 وحدَها، وnginx وحدَه يواجه العالم.

# ── (1) http ⇒ https ──────────────────────────────────────────────────────────
# ‏`.dev` في قائمة HSTS المحمَّلة، فالمتصفّحُ لا يطرق 80 أصلًا. يبقى هذا لعملاءَ
# آخرين (‏curl · سكربتات · روبوتات) ولتحدّي HTTP-01 عند تجديد الشهادة.
server {
    listen 80;
    listen [::]:80;
    server_name mihrab.dev www.mihrab.dev;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mihrab.dev$request_uri; }
}

# ── (2) www ⇒ الجذر ───────────────────────────────────────────────────────────
# عنوانٌ واحدٌ للمشروع لا اثنان: `www` يحوّل ولا يخدم.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;

    return 301 https://mihrab.dev$request_uri;
}

# ── (3) محراب ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mihrab.dev;

    ssl_certificate     /etc/letsencrypt/live/mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mihrab.dev/privkey.pem;

    # مسجَّلٌ في قائمة HSTS المحمَّلة بحكم اللاحقة؛ نُصرّح به كي يبقى صحيحًا لو
    # نُقِل المحتوى يومًا إلى لاحقةٍ غيرِ محمَّلة.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ‏محرابُ الويب يحمّل حزمةً من 17 م.ب (workbench.js) — لا حدَّ على الرفع لأنّ
    # المستخدم يحفظ ملفّاتٍ عبر الاتّصال نفسِه.
    client_max_body_size 0;

    # ── طبقةُ العزل: روابطُ المنتَج تشير إلى نطاقِنا لا إلى GitHub خامًا ──
    # علّتُها أنّ هذه الروابط تُطبَع في ثنائيّاتٍ موقَّعةٍ وفي إصداراتٍ ماضيةٍ لا
    # تُستردّ. فلو تبدّل اسمُ المنظّمة، يتغيّر هذا الملفُّ وحدَه.
    location = /issues   { return 301 https://github.com/mihrab-org/mihrab/issues; }
    location = /issues/new { return 301 https://github.com/mihrab-org/mihrab/issues/new; }
    location = /license  { return 301 https://github.com/mihrab-org/mihrab/blob/main/LICENSE; }
    location = /releases { return 301 https://github.com/mihrab-org/mihrab/releases; }
    location = /repo     { return 301 https://github.com/mihrab-org/mihrab; }

    # ── محرابُ الويب نفسُه ──
    location / {
        proxy_pass http://127.0.0.1:14006;
        proxy_http_version 1.1;

        # ‏**إلزاميّ**: مضيفُ الامتدادات يعمل على WebSocket. بلا هذين السطرين يُصيَّر
        # سطحُ المكتب كاملًا ثمّ **يتجمّد بلا رسالةِ خطأ** — أخبثُ عطبٍ في هذا الملفّ.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # جلسةُ محرِّرٍ تبقى مفتوحةً ساعاتٍ بلا حركةٍ ظاهرة؛ المهلةُ الافتراضيّة (60ث)
        # تقطعها فيبدو الأمرُ «انقطاعًا عشوائيًّا».
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }
}

# ── (4) أصلُ الـwebviews — منفصلٌ عن الأصل الرئيس عمدًا ──────────────────────
#
# **لماذا نطاقٌ فرعيٌّ بديل (‏*.webview) لا مسارٌ تحت الجذر:** كلُّ webview يُحمَّل في
# ‏iframe بأصلٍ عشوائيٍّ (‏uuid) كي لا يبلغ أصلَ سطحِ المكتب — وهذا عزلُ أمانِ VS Code
# نفسِه، لا اختراعُنا. مسارٌ تحت الجذر يُلغيه.
#
# وهذا يستلزم شهادةَ wildcard ⇒ **تحدّي DNS-01** (‏HTTP-01 لا يصدر wildcard أصلًا).
#
# ⚠️ **وينبغي أن يرافقه تعديلٌ في `product-overrides/product.json`**: المفتاح
# ‏`webviewContentExternalBaseUrlTemplate` يشير اليومَ إلى **شبكةِ مايكروسوفت**
# (‏vscode-cdn.net) وإلى **إيداعٍ ليس إيداعَنا** (‏نسخةُ insider ‏ef65ac1…). فمحتوى
# كلّ webview يأتي من خادمٍ لا نملكه ولا نطابق نسخته. لا يُبدَّل المفتاحُ إلّا **بعد**
# أن يخدم هذا القسمُ الملفّاتِ فعلًا، وإلّا انكسرت الـwebviews في المكتبيّ والويب معًا.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(?<wv>[^.]+)\.webview\.mihrab\.dev$;

    ssl_certificate     /etc/letsencrypt/live/webview.mihrab.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webview.mihrab.dev/privkey.pem;

    # محتوى الـwebview ملفّاتٌ ثابتةٌ مشحونةٌ في بنائنا (‏pre/index.html وخادمُ الخدمة).
    # القالبُ في product.json شكلُه: /{quality}/{commit}/out/vs/workbench/contrib/webview/browser/pre/
    location ~ ^/[^/]+/[^/]+/out/vs/workbench/contrib/webview/browser/pre/(?<rest>.*)$ {
        alias /opt/mihrab/web/out/vs/workbench/contrib/webview/browser/pre/$rest;
        add_header Access-Control-Allow-Origin "*" always;
        expires 7d;
    }

    location / { return 404; }
}

# يوضَع في http{} مرّةً واحدةً (‏conf.d/upgrade_map.conf مثلًا) إن لم يكن موجودًا:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
